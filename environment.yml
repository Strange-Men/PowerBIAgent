# Conda 环境配置文件
# 环境名称固定为 PBIAgent
# Python 版本固定为 3.11
#
# 创建环境:
#   conda env create -f environment.yml
# 更新环境:
#   conda env update -f environment.yml
# 激活环境:
#   conda activate PBIAgent

name: PBIAgent
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # 核心依赖在 pyproject.toml 中管理
    # 注意：-e . 仅当 pyproject.toml 实际可安装时启用
    # 当前 M0.2 阶段尚未验证包结构，暂不启用

