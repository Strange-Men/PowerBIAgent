- id: ERR-583-008
  title: 验收临时目录缺少统一 ownership 与 cleanup warning 契约
  category: ERR
  first_detected_version: M5.8.3
  symptom: 单个 TemporaryDirectory 删除失败会覆盖验收结果，原入口没有统一 marker 校验和真实残留报告
  local_evidence: 新 cleanup 模块缺失的 collection reproducer；实现后正常、异常、mutation、A→B→A、cancel、拒绝清理、ownership mismatch 与不可检查目录 15 项 PASS
  authoritative_sources:
  - title: Python 3.11 tempfile and contextmanager
    url: https://docs.python.org/3.11/library/tempfile.html
    reason: mkdtemp 需显式清理；finally 可以统一处理正常、异常和取消，Windows 句柄必须先关闭
  - title: Python contextlib contextmanager
    url: https://docs.python.org/3.11/library/contextlib.html#contextlib.contextmanager
    reason: yield 后 finally 清理资源，同时保留 body 原异常；不由 GC finalizer 绕过 ownership 校验
  root_cause: 验收脚本各自使用临时目录，缺少 exact path/inode/marker 校验与 cleanup warning/真实 residual 的统一输出
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: scripts 层统一受控 mkdtemp/finally、随机 ownership marker、路径及目录身份校验；先退出子进程再清理，拒绝清理不重试绕过、不误报零残留
  regression_tests:
  - backend/tests/unit/test_acceptance_tempdir.py
  prohibited_patterns:
  - shell wildcard 递归清理或跨工具绕过执行策略
  - 将 cleanup warning 当产品语义 P0 或隐藏真实 residual
  - 用 GC finalizer 绕过 ownership mismatch
  prevention_rules:
  - 常规验收不得要求用户手工删除临时目录
  - 模拟拒绝后的测试资源须由外层 owned fixture 自动回收
  related_adr: ADR-012
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-31'
    action: discovered
    version: M5.8.3
  - date: '2026-08-31'
    action: mitigation
    version: M5.8.3
- id: ERR-583-007
  title: 完整 runtime Measure 名称中的 Column 子串造成假筛选歧义
  category: ERR
  first_detected_version: M5.8.3
  symptom: Real 明确限定字段加真实成员的请求被额外识别出 Measure 名称内部的 Column，返回筛选澄清
  local_evidence: Real member A→B→A 的首轮 ZERO DAX；两条 Chat reproducer 与两条 span 用例失败，两个显式第二字段 negative control 保持通过；修复后 6 PASS
  authoritative_sources:
  - title: Microsoft DAX syntax and complete object references
    url: https://learn.microsoft.com/en-us/dax/dax-syntax-reference
    reason: runtime 对象以完整名称及 table ownership 区分，不能把已证明的对象引用内部子串另建为独立需求
  - title: ADR-008 runtime candidate authority
    reason: 当前明确对象范围优先，独立文本位置的多个明确字段仍须保留歧义
  root_cause: find_mentions 的 span 优先级只比较同一 object_type，筛选字段匹配看不到完整 Measure 的更长 runtime 名称
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 先收集所有 runtime 对象的 metadata span，再按请求类型投影候选；仅抑制被更强或同级更长名称包含的 span，不修改 DAX、schema、alias 或独立第二字段需求
