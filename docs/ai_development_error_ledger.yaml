  - 自动猜模板或 fallback catalog 第一项
  - 只在 renderer 内晚失败并留下 ReportSpec 或 artifact
  prevention_rules:
  - missing/invalid/stale template 必须 ZERO ReportData/ReportSpec/Renderer/artifact
  - frontend selector 只提供 choice，不判断 report intent 或增加 Chat/Report 模式
