- id: ERR-263-004
  title: Pending slot 在当前明确歧义后可能保留旧值并于后续轮泄漏
  category: ERR
  first_detected_version: M2.6.3
  symptom: Pending 已保存某 measure/dimension 时，当前用户对同 slot 表达 AMBIGUOUS/UNRESOLVED，merge 会标记 missing 但保留旧值；下一轮只补其他 slot 时可能重新使用旧值
  local_evidence: M2.6.3 final audit 的 clarification merge state transition；跨三轮 unit/API regression
  authoritative_sources:
  - title: ADR-008 Pending Clarification priority
    reason: current explicit grounded semantic 或 ambiguity 必须优先于旧 pending，不能让旧值绕过 clarification
  root_cause: Pending merge 只覆盖 RESOLVED delta，没有在当前 slot 被明确阻断时清除对应旧 pending value
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 当前 object AMBIGUOUS/UNRESOLVED/CONFIG_CONFLICT 清除对应 pending slot，unresolved member 清除同字段 pending filter；独立 scalar question 以固定语言分类丢弃未完成 ranking chain，业务身份仍只来自 Grounding
  regression_tests:
  - backend/tests/unit/test_semantic_grounding.py
  - backend/tests/api/test_chat.py
  prohibited_patterns:
  - missing slot 同时保留可被后续执行的旧 pending value
  - 用旧 pending 覆盖当前明确歧义
  prevention_rules:
  - 当前明确阻断状态必须使同 slot 保持 non-executable，直到重新权威解析
  - 新 standalone query 不得继承不兼容 pending analysis
  related_adr: ADR-008
