schema_version: '1.0'
entries:
- id: ERR-594-014
  title: 已证明的 follow-up cue 未传入 Coverage residue 消费
  category: ERR
  first_detected_version: M5.9.4
  symptom: 多轮“其中按产品看”已由 TurnRelationEvidence 识别为显式 follow-up，Product 也已解析，但 Coverage 仍把“其中”当作未知 filter modifier 并错误澄清
  local_evidence: DeepSeek-only 108-case Real 的 m594_turn_among_group；跨四域“其中 + measure”真实 Grounding/Coverage regression 在无 LLM 下复现
  authoritative_sources:
  - title: M5.9.3 Structured Turn Relation Evidence
    reason: 已匹配的 relation cue 是结构化证据，不得再次被解释为业务筛选词
  - title: M5.9.3 Semantic Obligation Completeness
    reason: Coverage 只应阻断未解释的 result-affecting modifier，不能阻断已证明的 discourse relation
  root_cause: inspect 已创建 TURN_RELATION resolved obligation，但调用 residue analyzer 时只传外部 language_evidence，遗漏 relation.matched_cue
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 仅把当前 TurnRelationEvidence 已匹配的 matched_cue 合并进 residue 的 consumable evidence；不把“其中”加入全局 functional terms，也不改变 follow-up 分类或继承规则
  regression_tests:
  - backend/tests/unit/test_business_language_stress_invariants.py
  - backend/tests/unit/test_semantic_completeness.py
  - scripts/manual_smoke/semantic_context_real_acceptance.py
  prohibited_patterns:
  - 无结构化 relation evidence 时全局吞掉可能影响结果的未知文本
  - 让旧 Memory 覆盖当前明确业务槽
  prevention_rules:
  - 每个 resolved TURN_RELATION obligation 的 matched cue 必须由同一次 Coverage inspection 消费
  - relation evidence 只影响话语结构，不拥有业务字段/member authority
  related_adr: ADR-018
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-10'
    action: discovered
    version: M5.9.4
  - date: '2026-09-10'
    action: mitigation
    version: M5.9.4
- id: ERR-594-013
  title: 已完整解析的 qualified MEMBER_SET 被结构连接词残留阻断
  category: ERR
  first_detected_version: M5.9.4
  symptom: Sales[Product]中两个 runtime-known 成员的 Total Quantity 分别查询已形成完整 MEMBER_SET delta，但 Coverage 将“中/和”组合当成额外 filter residue，返回 filter_field_unresolved
  local_evidence: DeepSeek-only 108-case Real 在 m594_member_set_0_0 复现；test-only qualified field + quoted known pair 无 LLM 回归稳定复现
  authoritative_sources:
  - title: M5.9.3 Semantic Obligation Completeness
    reason: 显式成员必须完整解析；全部 runtime-resolved 后纯集合连接词不应创造第二个业务 obligation
  - title: ADR-008 Business Semantic Catalog and Grounding Authority
    reason: 只有 runtime member 结果拥有成员 identity，连接词不拥有 member authority
  root_cause: Coverage 已消费 qualified field、两个成员与“分别”，但没有在完整 runtime resolution 证据下识别字段定位词与集合连接词组成的纯结构 residue
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 仅当 shape 为 MEMBER_SET/FILTERED_AGGREGATION、存在 member results 且所有成员均 runtime-resolved，并且清理后的全部 residue 只由中/和/与/以及/各自/一起构成时消费；任何其他字符仍 fail closed
  regression_tests:
  - backend/tests/unit/test_business_language_stress_invariants.py
  - backend/tests/unit/test_semantic_completeness.py
  - scripts/manual_smoke/semantic_context_real_acceptance.py
  prohibited_patterns:
  - 全局无条件删除单字连接词并可能掩盖未知成员
  - 对 known+unknown partial execute
  prevention_rules:
  - 结构 residue 豁免必须同时受 query shape、全成员 runtime resolution 与 whole-residue grammar 约束
  - unknown/ambiguous member obligation 优先阻断，保持 ZERO DAX
  related_adr: ADR-008
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-10'
    action: discovered
    version: M5.9.4
  - date: '2026-09-10'
    action: mitigation
    version: M5.9.4
- id: ERR-594-012
  title: ENTITY_LIST 字段别名末尾与 member suffix 重合时被误判为未知成员
  category: ERR
  first_detected_version: M5.9.4
  symptom: “列出所有区域”已由 Router 判定 ENTITY_LIST，弱草稿也指向 Product/Region 字段，但 Grounding 把字段别名中的“区”当作未知 member suffix，返回 member_no_match 而不是执行实体清单
  local_evidence: DeepSeek-only 108-case Real 在 m594_entity_list_1_0 稳定暴露；test-only Education catalog 令“学习项目”字段别名与“项目”member suffix 重合，可在无 LLM 情况下确定性复现
  authoritative_sources:
  - title: ADR-008 Business Semantic Catalog and Grounding Authority
    reason: 字段结构 cue 与 member literal 必须分工；字段名内部字符不能单独成为 member evidence
  - title: ADR-018 Deterministic Semantic Expression Normalization
    reason: ENTITY_LIST 结构词与字段 identity 的组合应由固定语法消费，不得交给 bounded selector 猜测
  root_cause: _field_has_dimension_cue 只覆盖哪些/有什么等问法，遗漏列出/展示/显示 + 所有/全部 + 字段；_member_evidence_fields 因此把字段别名内部的 member_suffix 当成独立显式成员要求
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 在共享 dimension cue grammar 中加入中英文 list/show + all + runtime field 结构，使该字段在 member discovery 前被证明为 grouping/entity requirement；未知成员 suffix 与 runtime validation 规则保持不变
  regression_tests:
  - backend/tests/unit/test_business_language_stress_invariants.py
  - backend/tests/unit/test_semantic_grounding.py
  - scripts/manual_smoke/semantic_context_real_acceptance.py
  prohibited_patterns:
  - 将 runtime 字段别名内部的 suffix 字符直接提升为未知成员证据
  - 为“区域”等具体业务词添加 production 特判
  prevention_rules:
  - Router 的 entity-list 结构语法与 Grounding dimension cue 必须成对回归
  - member suffix 只能在字段未被结构 cue 明确使用时提供候选证据
  related_adr: ADR-008
  related_commits: []
  status: monitoring
  events:
