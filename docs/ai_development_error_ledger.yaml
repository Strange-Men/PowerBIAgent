  authoritative_sources:
  - title: ADR-017 Bounded Runtime Concurrency and Resilience
    reason: application-owned worker 可以长生命周期复用 transport，但每个 work item 必须使用自己的 request-local deadline 和 recorder
  root_cause: asyncio task 创建时复制 ContextVar；原 worker pool 只重新绑定 PerformanceRecorder，没有在 session startup 和每个 work item 执行时重新绑定 deadline
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: work item 捕获 immutable absolute deadline；worker 在首 session startup 和每次 operation 前绑定对应 deadline，finally 恢复 worker context；deadline-limited timeout 标记为不可重试 request_deadline_exceeded
  regression_tests:
