- id: ERR-584-004
  title: 合法成员 ID 不等于输入筛选与成员语义等价
  category: ERR
  first_detected_version: M5.8.4
  symptom: Real 负向用例中一个不存在的具体地点被解释成覆盖范围更大的区域
  local_evidence: cross_language_real_acceptance 的 unproved_place 原始运行出现 completed；专项计划保留失败与复测状态
  authoritative_sources:
  - title: ADR-015 Cross-language Runtime Grounding
    reason: LLM 只能解释等价语言，不能扩大筛选范围或从外部知识生成事实关系
  root_cause: 成员翻译指令仍被理解为类别归属分类；仅验证返回 ID 的存在性不能证明语言等价
  failed_attempts:
  - 强制同一集合和粒度后，城市负向通过，但并列正常区域翻译过度澄清
  - 隔离 requested_value 与整句问题后，消除了其他槽干扰，但 DeepSeek 正常区域仍过度澄清
  - 加入模型内方向类别说明后，正常区域仍偶发 abstain；末尾 worldwide containment 检查与 model-local category 说明冲突
  repair_attempt_count: 4
  continuation_authorization:
    authority: explicit_user_request
    entry_id: ERR-584-004
    version: M5.8.4
    source: docs/milestones/m5/m5_8_4_cross_language_grounding_plan.md
    quote: 不要因为发现 P0/P1 或测试失败而中断，持续定位、修复、回归，直到满足 COMPLETE 条件；只有真正不可控的外部环境阻塞才允许最终报告 BLOCKED。
  final_fix: 同一 bounded member selector 明确要求相同集合与粒度，禁止 parent category、containment 和关联推断；并列正常翻译与未知地点负向 Real 验证
  regression_tests:
  - scripts/manual_smoke/cross_language_real_acceptance.py
  - backend/tests/unit/test_cross_language_grounding.py
  prohibited_patterns:
  - 只凭 member ID 属于白名单就宣称自然语言含义正确
  - 以区域包含具体地点替代原始地点筛选
  prevention_rules:
  - 每次语言调整必须同时验证 positive translation 与 unknown/compound category ZERO DAX
  - 不把 fixture selector 当真实语言质量证据
  related_adr: ADR-015
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-31'
    action: discovered
    version: M5.8.4
  - date: '2026-08-31'
    action: mitigation
    version: M5.8.4
- id: ERR-584-005
  title: HTTP 验收观察超时后后台请求未退出就清理资源
  category: ERR
  first_detected_version: M5.8.4
  symptom: Real HTTP 超时后 SQLite 文件仍被后台请求占用，owned temp cleanup 出现 PermissionError
  local_evidence: 验收运行输出 temporary_residual=1；数据库各业务表只读核验为零，目录删除被执行策略拒绝
  authoritative_sources:
  - title: AGENTS.md automation ownership and cleanup contract
    reason: 失败请求也必须先结束业务执行，再清理 ownership 资源并核验 residual
  root_cause: HTTP client deadline 短于多个生产 LLM stage 的总时长，managed_test_run 退出时未追踪仍执行的 server task
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 验收脚本统一追踪所有请求及晚返回报表，先 drain/cancel 再运行正式 API cleanup，localhost 不经过外部 proxy；生产 timeout/retry 不变
  regression_tests:
  - backend/tests/unit/test_acceptance_tempdir.py
  prohibited_patterns:
  - 清理后仍允许后台请求创建资源
  - 把 cleanup_warning 当 residual=0
  - 绕过执行策略删除残留
  prevention_rules:
  - 失败与取消路径均验证后台任务在资源 teardown 前结束
  - 证据按 request identity 隔离，不能按重复问题文本混合不同模型或并发请求
  related_adr: ADR-015
  related_commits: []
  status: monitoring
