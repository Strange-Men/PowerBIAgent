    action: discovered
    version: M5.9.2
  - date: '2026-09-08'
    action: mitigation
    version: M5.9.2
- id: ERR-592-001
  title: Caller cancellation 提前释放 accepted Local MCP capacity
  category: ERR
  first_detected_version: M5.9.2
  symptom: queued caller 取消时物理 item 仍在 queue 但 global slot 已释放，新请求可泄漏 raw QueueFull；已 dispatch caller 取消时 operation 仍存活但 global/per-request slot 已释放，实际并发超过 configured bound
  local_evidence: 单 worker满载加两个 canceled queued item 可确定性触发 raw asyncio.QueueFull；双 worker、per-request=1 时取消已 dispatch caller 后第二个同 request operation 在首 operation drain 前启动，max_active_handlers=2
  authoritative_sources:
  - title: ADR-017 Bounded Runtime Concurrency and Resilience
    reason: application-owned MCP work 必须始终拥有 bounded global/per-request capacity，已 accepted work 在 shutdown/cancellation 下继续 drain
  - title: Python 3.11 asyncio queues
    url: https://docs.python.org/3.11/library/asyncio-queue.html
    reason: put_nowait 在物理 queue 满时抛 QueueFull，caller semaphore 不能替代 queue item lifecycle ownership
  - title: Python 3.11 asyncio synchronization primitives
    url: https://docs.python.org/3.11/library/asyncio-sync.html
    reason: Semaphore 的 acquire/release 计数必须与受保护 operation 的完整存活期一致
  - title: Python 3.11 asyncio futures
    url: https://docs.python.org/3.11/library/asyncio-future.html
    reason: cancelled/done future 不可再次 set_result/set_exception，worker 必须把 caller completion 与 operation cleanup 分离
  root_cause: _run_session caller finally 无条件释放 global/per-request semaphore；capacity ownership 未在 enqueue success 后转移给 work item/worker lifecycle
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: work item 记录 global/per-request capacity ownership；未 accepted 仍由 caller release，accepted item 由 worker在 canceled skip、normal completion、failure 或 session startup failure 后幂等 release；caller cancellation shield operation future并只取消 caller future；QueueFull防御性映射为 controlled overload
  regression_tests:
  - backend/tests/unit/test_local_mcp_worker_pool.py
  prohibited_patterns:
  - caller future 完成或取消等同于 accepted MCP work 已完成
  - queue 物理容量与 admission capacity 使用不同生命周期
  prevention_rules:
  - enqueue success 是 capacity ownership 从 caller 向 work item 的唯一转移点
  - accepted capacity 只能由 worker lifecycle 幂等释放
  - cancellation/shutdown/crash matrix 必须验证 queue empty、semaphore恢复、worker/session residual=0
  related_adr: ADR-017
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-08'
    action: discovered
    version: M5.9.2
  - date: '2026-09-08'
    action: mitigation
    version: M5.9.2
