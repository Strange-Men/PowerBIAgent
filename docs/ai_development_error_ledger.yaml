schema_version: '1.0'
entries:
- id: ERR-584-010
  title: Bounded selector 返回路径丢失调用方语义角色
  category: ERR
  first_detected_version: M5.8.4
  symptom: BoundedLLMObjectSelector 已接收真实 role，但 invalid response、unknown candidate、resolved 与 abstain 返回路径仍硬编码 measure；上层 defensive normalization 掩盖 selector 自身 contract 错误
  local_evidence: 直接 selector 回归在 dimension、ranking_dimension、filter_field、date_field 的多条路径上可观察错误 role；修复后 5 类 role 乘 6 条路径共 30 个 case 通过
  authoritative_sources:
  - title: ADR-015 bounded runtime grounding contract
    reason: selector 只能在调用方声明的 canonical slot role 中解释 runtime candidate，返回结果必须保留该 role
  root_cause: selector 从仅 measure 场景扩展到通用 object role 后，四个构造 ObjectGroundingResult 的分支保留了旧硬编码值；上层 model_copy 使正常集成测试未直接暴露问题
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 所有 selector 返回路径统一使用 role=role；保留上层 defensive normalization，不修改 candidate 集合、semantic decision、canonical identity、DAX 或事实结果
  regression_tests:
  - backend/tests/unit/test_cross_language_grounding.py
  prohibited_patterns:
  - BoundedLLMObjectSelector 内部把返回 role 硬编码为某个具体语义角色
  prevention_rules:
  - selector contract 测试必须直接调用 selector，并覆盖 resolved、ambiguous、unresolved、illegal candidate、invalid structured response 与 provider error
  related_adr: ADR-015
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-02'
    action: discovered
    version: M5.8.4
  - date: '2026-09-02'
    action: mitigation
    version: M5.8.4
- id: ERR-584-009
  title: 相对月份 API 验收随系统日期跨月漂移
  category: ERR
  first_detected_version: M5.8.4
  symptom: 2026-09-01 exact-SHA CI 的 Semantic Compatibility Gate 中，相对时间多轮测试仍期待 2026-08 本月，生产解析正确得到 2026-09，导致门禁退出码 1
  local_evidence: PowerBIAgent Validation run 33455159267 第 5 步失败；本地 CI 等价复现为 1 failed / 657 passed，失败断言为 2026-09-01 对 2026-08-01
  authoritative_sources:
  - title: TimeGrounder injectable clock contract
    reason: 相对日期测试必须固定 reference date，不能把执行机器当天日期隐式写进 expected
  root_cause: API production-path 测试硬编码相对月份 expected，却未使用 SemanticGroundingService 已提供的 today 注入点固定测试时钟
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 该多轮 API 测试在创建应用前将 grounding factory 固定到 2026-08-31；生产时间解析、DAX 与事实 authority 不变
  regression_tests:
  - backend/tests/api/test_chat.py
  prohibited_patterns:
  - 相对日期测试同时使用真实 date.today 与固定年月 expected
  prevention_rules:
  - 本月、上月、去年和最近 N 月的确定性测试必须显式注入 reference date
  related_adr: ADR-015
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-01'
    action: discovered
    version: M5.8.4
  - date: '2026-09-01'
    action: mitigation
    version: M5.8.4
- id: ERR-584-008
  title: 已提交字段 owner 覆盖当前两个明确限定的筛选字段
  category: ERR
  first_detected_version: M5.8.4
  symptom: 用户同时明确两个 Table[Column]，旧逻辑仍可用 committed dimension_tables 选中其中一个
  local_evidence: Grounding reproducer 从预期 AMBIGUOUS 实际 RESOLVED；修复后显式双 owner 拒绝且 ZERO member lookup，未指定 owner 的合法 KEEP 保持通过
  authoritative_sources:
  - title: ADR-008 and ADR-015 current explicit before Memory
    reason: canonical Memory 只能补省略槽，不能覆盖本轮明确冲突
  root_cause: ambiguous filter 的 Memory owner 消歧未区分省略 table qualification 与当前多个明确对象
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 仅同 canonical field name 且没有多个当前明确 qualified owner 时允许继承；其他歧义保持 fail closed
  regression_tests:
  - backend/tests/unit/test_cross_language_grounding.py
  prohibited_patterns:
  - 使用旧 Memory 任意选择当前明确歧义中的一个字段
  prevention_rules:
  - canonical KEEP 的正向对照必须伴随当前显式双 owner 的负向验证
  related_adr: ADR-015
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-31'
    action: discovered
    version: M5.8.4
  - date: '2026-08-31'
    action: mitigation
    version: M5.8.4
