- id: ERR-240-001
  title: Filter 字段被错误提升为 Group-by 且 SUMMARIZECOLUMNS 参数乱序
  category: ERR
  first_detected_version: M2.4
  symptom: QueryPlan dimensions 为空且只有筛选字段时，DeepSeek 仍把筛选列加入 group-by，并把 FILTER 参数放在 name/expression 对之后；旧 Layer 3 只检查字段是否出现，错误 DAX 到达 Power BI 后才失败
  local_evidence: M2.4 第三个真实 Chat Case 的本地临时 Trace；QueryPlan 正确但 DAX 在 query_result_error 阶段被 Power BI 拒绝
  authoritative_sources:
  - title: M2.4 DAX / QueryPlan 一致性契约
    reason: QueryPlan.dimensions 是唯一 group-by 来源，Filter 字段只能作为筛选条件
  root_cause: DAX Prompt 未区分 Dimension 与 Filter 的粒度职责，Layer 3 缺少 group-by 集合和 SUMMARIZECOLUMNS 参数阶段检查
  failed_attempts:
  - 仅检查 Measure/Dimension/Filter 名称是否出现在 DAX，无法识别额外 group-by 与 filter-after-pair
  repair_attempt_count: 2
  final_fix: M2.4 先以 Prompt/validator 缓解；M2.6.3 从 Real path 移除自由 DAX authority，由 DeterministicDAXBuilder 固定生成 exact dimensions group-by 与 TREATAS EQ filter，Independent Layer 3 独立验证无额外 group-by/filter
  regression_tests:
  - backend/tests/unit/test_dax_service.py
  - backend/tests/unit/test_validation_fixes.py
  prohibited_patterns:
  - 因字段存在于 QueryPlan.filters 就把它加入 group-by
  - SUMMARIZECOLUMNS 的 filter table 参数位于 name/expression 对之后
  prevention_rules:
  - 只有 QueryPlan.dimensions 可以成为 group-by
