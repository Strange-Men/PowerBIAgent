schema_version: '1.0'
entries:
- id: TX-001
  title: Service 直接写 Memory
  category: TX
  first_detected_version: M1.6.3.2
  symptom: 两个 Service 的 _do_execute 中仍直接调用 self.memory_repo.mark_failed() 和 self.memory_repo.commit()
  local_evidence: deepseek_turn_service.py:463,529,570,641; mock_turn_service.py:498,520,597
  authoritative_sources:
  - title: 架构原则 — 单写入者
    reason: TurnPipeline 为 Memory 唯一写入者，Service 不得持有可写 Repository
  root_cause: M1.6.3 未完全收口直接 Memory 写入，Service 仍保留 self.memory_repo 实例字段
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 全部替换为 TurnPipeline 方法
  regression_tests:
  - backend/tests/unit/test_transaction_boundary.py
  prohibited_patterns:
  - self.memory_repo.mark_failed(
  - self.memory_repo.commit(
  - self.memory_repo.create_pending(
  prevention_rules:
  - Service 不持有 memory_repo 实例字段
  - Memory 写入仅通过 TurnPipeline
  related_adr: ADR-005
  related_commits:
  - d57e38c M1.6.3.2_事务边界与单写入者彻底收口
  status: resolved
  events:
  - date: '2026-08-05'
    action: discovered
    version: M1.6.3.2
  - date: '2026-08-05'
    action: resolved
    version: M1.6.3.2
    commit: d57e38c
- id: TX-002
  title: Snapshot 双重写入
  category: TX
  first_detected_version: M1.6.3.2
  symptom: DeepSeekTurnService 成功路径中 _do_execute 内部调用 _save_snapshot() 后再由 TurnPipeline.execute() 二次保存
  local_evidence: deepseek_turn_service.py:613 + turn_pipeline.py:205
  authoritative_sources:
  - title: 架构原则 — 单写入者
    reason: Snapshot 仅由 TurnPipeline 管理，Service 不得自行保存
  root_cause: Service 成功路径自行保存快照，Pipeline 再重复保存，形成双写
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 移除 Service 内 _save_snapshot() 调用，SnapshotStore 完全由 TurnPipeline 持有
  regression_tests:
  - backend/tests/unit/test_transaction_boundary.py
  prohibited_patterns:
  - _save_snapshot(
  - self.snapshot_store
  prevention_rules:
  - Service 不持有 snapshot_store 实例字段
  - Snapshot 保存仅 TurnPipeline.execute()
  related_adr: ADR-005
  related_commits:
  - d57e38c M1.6.3.2_事务边界与单写入者彻底收口
  status: resolved
  events:
  - date: '2026-08-05'
    action: discovered
    version: M1.6.3.2
  - date: '2026-08-05'
    action: resolved
    version: M1.6.3.2
    commit: d57e38c
- id: TX-003
  title: Service 和 Pipeline 事务边界不清
  category: TX
  first_detected_version: M1.6.3.2
  symptom: Service 各自持有 memory_repo/snapshot_store 实例字段，自行管理提交和快照生命周期
  local_evidence: DeepSeekTurnService 和 MockTurnService 构造函数均接收并保存 memory_repo 为实例字段
  authoritative_sources:
  - title: 架构原则 — 控制面统一
    reason: 事务控制面应完全统一到 Pipeline
  root_cause: 控制面未完全统一到 Pipeline，Service 保留独立的 Repository 引用
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: Service 移除 self.memory_repo 和 self.snapshot_store 实例字段
  regression_tests:
  - backend/tests/unit/test_transaction_boundary.py
  prohibited_patterns:
  - self.memory_repo =
  - self.snapshot_store =
  prevention_rules:
  - Service 构造函数不接收 Repository 实例字段
  - 所有持久化操作通过 TurnPipeline
  related_adr: ADR-005
  related_commits:
  - d57e38c M1.6.3.2_事务边界与单写入者彻底收口
  status: resolved
  events:
