# ============================================================================
# AI 开发错误总账 — PowerBIAgent 项目治理文件
# ============================================================================
#
# 本文件是后续 Claude 开发必须读取的正式机器错题总账。
# 每条错误记录包含根因、修复、回归测试和防复发规则。
#
# 规则：
#   1. ID 唯一，历史条目不得删除
#   2. 根因和原始证据不得被静默重写
#   3. 状态变化通过 events 追加记录
#   4. 修复次数不得超过 2（repair_attempt_count <= 2）
#   5. resolved 必须至少关联一个真实存在的回归测试
#   6. 架构类错误必须关联 ADR 或明确说明为何无需 ADR
#   7. authoritative_sources 无资料时必须明确记录原因，不得伪造来源
#   8. 不得填写不存在的 Commit 或测试路径
#   9. 不得输出 Secret
#
# Schema 版本：1.0
# 最后更新：2026-08-05 | M1.6.5
# ============================================================================

schema_version: "1.0"

# 状态枚举
#   open         — 新发现，尚未修复
#   blocked      — 因外部依赖或未知原因暂时无法修复
#   monitoring   — 已修复，持续观察中（修复后需经过真实环境验证）
#   resolved     — 已修复，回归测试通过，门禁生效
#   superseded   — 被后续架构决定取代（如 ADR-001 → ADR-005）
#
# 状态转换：
#   open → blocked | resolved | superseded
#   blocked → open | resolved
#   resolved → monitoring | open (复发)
#   monitoring → resolved | open (复发)

# 错误分类
#   TX       — 事务边界与数据一致性
#   NET      — 网络、HTTP、异常分类
#   GOV      — 治理、文档、流程
#   ARCH     — 架构偏移与设计违反
#   ERR      — 错误处理与异常映射
#   TRUTH    — AI 真实性与验证
#   ADV      — 对抗输入与安全边界
#   DOC      — 文档不一致
#   TEST     — 测试质量与真实性

# 条目必填字段：
#   id, title, category, first_detected_version
#   symptom, local_evidence, authoritative_sources
#   root_cause, failed_attempts, repair_attempt_count
#   final_fix, regression_tests, prohibited_patterns
#   prevention_rules, related_adr, related_commits
#   status, events
#
# 其中：
#   - failed_attempts 为列表，记录每次失败尝试和原因
#   - repair_attempt_count 为最终成功修复前的失败次数（含成功的最后一次）
#   - events 为按时间排序的事件列表，记录状态变化
#   - regression_tests 为测试路径列表，resolved 状态至少一条
#   - related_adr 可为 null 或明确说明为何无 ADR

entries: []
