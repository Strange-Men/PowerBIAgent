- id: ERR-594-011
  title: 通用按月别名偶发生成双时间轴并在 Result Gate 失败
  category: ERR
  first_detected_version: M5.9.4
  symptom: “订单数按月看变化”在同一 Date 表同时存在 MonthName 与 YearMonth 候选时，bounded selector 偶发先接受 MonthName，再追加 runtime temporal binding YearMonth；错误 canonical plan 已生成 DAX，最终才以 result_trend_temporal_value_invalid 失败
  local_evidence: DeepSeek-only M5.9.4 Real probe/full run 间歇复现；canonical dimensions 为 MonthName/YearMonth，首列是非日期字符串；测试以两个对象共享“月/月份”别名稳定复现 selector 前歧义
  authoritative_sources:
  - title: ADR-008 Business Semantic Catalog and Grounding Authority
    reason: “按月”只证明 grouping grain；实际时间轴必须由 runtime 唯一 temporal binding 决定
  - title: M5.8.5 Canonical Shape Completeness
    reason: 当前 trend 事实/展示合同只有一个 temporal grouping，额外维度必须在 DAX 前 fail closed
  root_cause: 通用时间粒度词同时参与普通 dimension mention；首轮抑制逻辑只覆盖 RESOLVED，未覆盖 selector 前 AMBIGUOUS candidate set，导致候选选择具有 Provider 非确定性
  failed_attempts:
  - 仅在 current_dimension 已 RESOLVED 且 phrase 为通用时间词时清除；AMBIGUOUS 候选仍进入 bounded selector，Real probe 继续偶发失败
  - 扩展为检查 RESOLVED/AMBIGUOUS candidate language terms，但 Real Catalog 中“月”可只来自 LLM weak draft、current mention 仍为 NOT_MENTIONED，第三次探针再次触发 selector
  repair_attempt_count: 3
  continuation_authorization:
    authority: explicit_user_request
    entry_id: ERR-594-011
    version: M5.9.4
    source: docs/milestones/m5/m5_9_4_business_language_stress_plan.md
    quote: 在进入 M5.10 前，对当前已支持的 Power BI 业务问答能力做系统化自然语言组合压力测试，主动发现并收口潜在语义解析缺陷。
  final_fix: 同时在 selector 前删除只等于通用 grain cue 的 weak dimension echo；真实 runtime 字段名仍保留。current mention 的通用 cue 也只在全部命中 term 属于同一 grain 时降为 grouping evidence，最终只由 runtime temporal binding 生成时间轴；CanonicalShapeCompletenessGate 拒绝多维 trend，确保同类异常 ZERO DAX
  regression_tests:
  - backend/tests/unit/test_business_language_stress_invariants.py
  - backend/tests/unit/test_semantic_completeness.py
  - scripts/manual_smoke/semantic_context_real_acceptance.py
  prohibited_patterns:
  - 将“按月/月度/monthly”本身绑定为普通业务维度后再追加 temporal binding
  - 允许多维 trend canonical plan 进入 Deterministic DAX
  prevention_rules:
  - 通用 grain cue 只能在全部命中候选均为同粒度通用词时被抑制；显式对象名不得被静默忽略
  - trend canonical plan 必须恰有一个 runtime-proven temporal dimension
  related_adr: ADR-008
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-10'
    action: discovered
    version: M5.9.4
  - date: '2026-09-10'
    action: mitigation
    version: M5.9.4
