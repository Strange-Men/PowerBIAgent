- id: ARCH-164-001
  title: Service 暴露可写 Memory Repository
  category: ARCH
  first_detected_version: M1.6.4
  symptom: 两个 Service 均有 memory_repo @property，允许绕过 TurnPipeline 直接写 Memory
  local_evidence: mock_turn_service.py 和 deepseek_turn_service.py 中的 memory_repo @property
  authoritative_sources:
  - title: ADR-005
    reason: TurnPipeline 为唯一事务入口，Service 不得暴露可写 Repository
  root_cause: M1.6.3.2 收口后 Service 仍暴露 memory_repo 公共属性
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 移除两个 Service 的 memory_repo @property，只读查询通过 TurnPipeline 只读方法
  regression_tests:
  - backend/tests/unit/test_architecture_truth.py
  prohibited_patterns:
  - def memory_repo
  - pipeline.memory_repo
  - self.memory_repo
  prevention_rules:
  - Service 不暴露 Repository 公共访问
  related_adr: ADR-005
  related_commits:
