- id: GOV-570-001
  title: 报表请求不得在模板缺失时继续或隐式选择默认模板
  category: GOV
  first_detected_version: M5.7
  symptom: 既有 report intent 在未传 report_template_key 时由后端自动选择默认 sales_report，无法证明用户显式选择了固定模板
  local_evidence: M5.7 启动审计确认 TemplateCatalog.default_for_intent 与前端未选择不传字段共同形成隐式默认路径
  authoritative_sources:
  - title: M5.7 Report Template Required contract
    reason: 任意 report intent/request 都必须显式拥有 registry-valid template key
  - title: ADR-011 Adaptive Report Planning and Visualization Authority
    reason: template 与 layout authority 只能属于 registry 和确定性代码
  root_cause: 历史 M5.2 产品合同把 report_template_key 定义为可选 override，并允许后端为 report intent 选择默认模板
  failed_attempts: []
  repair_attempt_count: 0
  final_fix: M5.7 要求在 ReportData assembly、ReportSpec、Renderer 与 artifact 前验证显式 template key；missing/invalid/stale 均 template-required/fail closed，当前 sales_report 展示为简易模板
