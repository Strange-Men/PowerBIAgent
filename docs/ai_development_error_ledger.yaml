  title: 验收临时目录缺少统一 ownership 与 cleanup warning 契约
  category: ERR
  first_detected_version: M5.8.3
  symptom: 单个 TemporaryDirectory 删除失败会覆盖验收结果，原入口没有统一 marker 校验和真实残留报告
  local_evidence: 新 cleanup 模块缺失的 collection reproducer；实现后正常、异常、mutation、A→B→A、cancel、拒绝清理、ownership mismatch 与不可检查目录 15 项 PASS
  authoritative_sources:
  - title: Python 3.11 tempfile and contextmanager
    url: https://docs.python.org/3.11/library/tempfile.html
    reason: mkdtemp 需显式清理；finally 可以统一处理正常、异常和取消，Windows 句柄必须先关闭
  - title: Python contextlib contextmanager
    url: https://docs.python.org/3.11/library/contextlib.html#contextlib.contextmanager
    reason: yield 后 finally 清理资源，同时保留 body 原异常；不由 GC finalizer 绕过 ownership 校验
  root_cause: 验收脚本各自使用临时目录，缺少 exact path/inode/marker 校验与 cleanup warning/真实 residual 的统一输出
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: scripts 层统一受控 mkdtemp/finally、随机 ownership marker、路径及目录身份校验；先退出子进程再清理，拒绝清理不重试绕过、不误报零残留
  regression_tests:
  - backend/tests/unit/test_acceptance_tempdir.py
  prohibited_patterns:
  - shell wildcard 递归清理或跨工具绕过执行策略
  - 将 cleanup warning 当产品语义 P0 或隐藏真实 residual
  - 用 GC finalizer 绕过 ownership mismatch
  prevention_rules:
  - 常规验收不得要求用户手工删除临时目录
