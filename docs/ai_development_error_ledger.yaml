- id: ERR-263-002
  title: Filter member 与 Dimension cue 混淆导致真实 Filter TopN grounding 失败
  category: ERR
  first_detected_version: M2.6.3
  symptom: 同一输入同时包含 grouping field 与 runtime member 时，weak draft filter 或 field mentions 可能把明确 grouping field 当 filter candidate，ka8 filter+TopN 无法稳定形成 canonical filter/dimension 分工
  local_evidence: ka8 Real focused failure；SemanticGroundingService grouping-cue exclusion 与 bounded runtime member discovery tests
  authoritative_sources:
  - title: ADR-008 Grounding authority
    reason: Dimension identity 和 Filter member 必须分别由当前明确 cue 与 runtime member 证明
  root_cause: Filter grounding 复用全量 field mentions，未先排除当前输入中明确作为 grouping 的 field，也缺少 draft-independent runtime member discovery
  failed_attempts:
  - 只从 QueryPlan draft filters 做 member lookup，仍会受 weak draft 字段选择影响
  repair_attempt_count: 2
  final_fix: 明确 grouping cue 的 field 不进入 filter candidates；最多两个字段执行 bounded runtime member discovery，只有唯一当前字面 member 命中才形成 EQ filter，多个匹配继续 clarification
  regression_tests:
  - backend/tests/unit/test_semantic_grounding.py
  - backend/tests/api/test_chat.py
  prohibited_patterns:
  - 把 grouping field 同时默认为 filter field
  - 无 runtime member 证据接受 draft filter value
  prevention_rules:
  - Dimension cue 优先排除同字段 Filter candidate
  - member discovery 必须 bounded、runtime-backed、唯一命中
  related_adr: ADR-008
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-14'
    action: discovered
    version: M2.6.3
  - date: '2026-08-14'
    action: mitigation
    version: M2.6.3
