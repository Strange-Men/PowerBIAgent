- id: GOV-264-003
  title: Real tie 门禁错误依赖当前 PBIX 数据分布
  category: GOV
  first_detected_version: M2.6.4
  issue_signature: top_n_boundary_tie_cases_observed:0
  first_wrong_stage: acceptance_summary
  symptom: 8/8 Known-answer、3/3 Real TopN 和全部 Truth counters 通过，但新增 gate 因当前数据没有 boundary tie 将整套验收判失败
  local_evidence: Fresh Production E2E 显示 3 个 TopN 均 PASS、boundary tie observed=0
  authoritative_sources:
  - title: Microsoft Learn TOPN function
    url: https://learn.microsoft.com/en-us/dax/topn-function-dax
    reason: ties 可使结果超过 N，但并非每个数据集或每次 TopN 都必须出现 ties
  root_cause: 将“实现必须正确处理 ties”误写成“外部真实数据必须包含 tie”
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: Real gate 要求全部 TopN/Oracle 通过；若观测到 tie 则 Answer 必须 truth-safe；固定 tie/no-tie/truncated tests 不依赖数据分布
  regression_tests:
  - backend/tests/unit/test_verified_facts.py
  - backend/tests/integration/test_multi_turn_benchmark.py
  prohibited_patterns:
  - 为制造 PASS 修改 PBIX、expected 或真实值
  - 把某次样本必须出现 tie 当作 TOPN 契约
  prevention_rules:
  - 数据分布无关的语义边界用 deterministic fixtures；Real 数据存在的 case 用 Oracle 验证
  related_adr: ADR-009
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-14'
    action: mitigation
    version: M2.6.4
- id: GOV-260-001
  title: Enum 与 Prompt 暴露能力但真实链缺少确定性验证
  category: GOV
  first_detected_version: M2.6
  symptom: Filter Operator Enum 暴露多种操作，但旧 Layer 3 只验证字段出现；TopN 选择与最终排序也未分离，未验证能力可能被误写为 Supported
  local_evidence: ValidationService M2.5 基线只检查 Filter field 引用；Business Golden 曾使用 row_count <= top_n
  authoritative_sources:
  - title: M2.6 数据问答正确性契约
    reason: 真实能力只能在 QueryPlan、Prompt、Layer 2/3、测试和 Real 证据形成闭环后标为 SUPPORTED
  root_cause: 结构契约、生成提示与验收证据之间缺少统一 capability truthfulness 门禁
  failed_attempts:
  - 以 Enum 存在或字段出现在 DAX 中代替 operator/value 语义证明
  repair_attempt_count: 1
  final_fix: 建立 Filter Capability Matrix；Real 仅 eq=SUPPORTED，其余 NOT_VERIFIED 受控拒绝；Layer 3 比较 field/operator/value 与 extra filter，并拆分 TopN selection / presentation ordering
  regression_tests:
  - backend/tests/unit/test_validation_fixes.py
  - backend/tests/unit/test_dax_service.py
  - backend/tests/unit/test_query_plan_service.py
  - backend/tests/api/test_chat.py
  prohibited_patterns:
  - Enum 存在即宣称真实支持
  - 使用 row_count <= top_n 作为通用 TopN 正确性标准
  prevention_rules:
  - 未形成可确定验证闭环的 Operator 必须标记 NOT_VERIFIED 并在 Real 路径受控拒绝
  - TopN selection 与 presentation ordering 必须独立验证
  related_adr: ADR-005
  related_commits: []
  status: monitoring
  events:
  - date: '2026-08-12'
    action: mitigation
    version: M2.6
