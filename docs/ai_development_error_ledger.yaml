- id: ERR-591-001
  title: Local MCP shutdown 与 enqueue 缺少共同线性化点
  category: ERR
  first_detected_version: M5.9.1
  symptom: request 通过 worker ensure 后可在 enqueue 前被 shutdown 越过；STOP 被消费且 worker 退出后 request 仍 enqueue，future 永久无人完成
  local_evidence: Event barrier 精确控制 ensure-complete、enqueue-paused、aclose-complete、enqueue-resume；旧实现 bounded wait 确定性 timeout
  authoritative_sources:
  - title: ADR-017 Bounded Runtime Concurrency and Resilience
    reason: shutdown 开始后不接受新 work，已接纳 work drain，future/queue/admission/session 不得残留
  - title: Python 3.11 asyncio synchronization primitives
    url: https://docs.python.org/3.11/library/asyncio-sync.html
    reason: asyncio.Lock 为共享状态与 enqueue 临界区提供互斥访问
  - title: Python 3.11 asyncio queues
    url: https://docs.python.org/3.11/library/asyncio-queue.html
    reason: Queue 的 put/get 是独立操作，生命周期状态检查需要由调用方建立共同临界区
  root_cause: _ensure_workers 内检查 _closed 后即释放 worker lock，后续 admission/enqueue 没有在同一 lock 下重新检查 lifecycle state
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 复用 worker lifecycle lock 原子化 enqueue 前 closed 复核与 put_nowait；enqueue 成功定义为 accepted，STOP 只排在全部 accepted work 之后
  regression_tests:
  - backend/tests/unit/test_local_mcp_worker_pool.py
