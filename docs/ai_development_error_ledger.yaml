- id: ERR-164-001
  title: API 错误映射收口不全
  category: ERR
  first_detected_version: M1.6.4
  symptom: 402 伪装为 api_key_missing，LLMRequestError/ResponseError/ValidationError 无显式映射
  local_evidence: routes.py 中 LLMConfigurationError else 分支返回 deepseek_api_key_missing
  authoritative_sources:
  - title: DeepSeek API Docs
    url: https://api-docs.deepseek.com/quick_start/error_codes
    reason: 402 为余额不足
  root_cause: LLMConfigurationError 未按 error_code 区分，else 分支错误映射
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 按 error_code 区分配置错误，补齐显式映射，添加 LLMProviderError 兜底
