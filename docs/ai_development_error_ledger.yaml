  final_fix: 建立与 committed Memory 分离的 PendingClarificationContext；e1 保存 top1/desc 并缺 measure/dimension，e2 权威补齐 Total Sales 后仍缺 dimension，新增 e3“按产品”后才执行；正式基线更正为 6 Conversation / 16 Turn
