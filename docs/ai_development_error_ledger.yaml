- id: ERR-592-002
  title: Sole-waiter metadata singleflight 取消后继续无主 retry
  category: ERR
  first_detected_version: M5.9.2
  symptom: 唯一 schema waiter 取消后，shielded leader 仍等待 transport failure、执行 backoff 并发起第二次 adapter operation，形成无 caller ownership 的后台工作
  local_evidence: Event barrier 在第一次 schema read 内冻结唯一 waiter；取消并释放 transient failure 后旧实现 schema_calls=2，修复后取消直接 drain leader，fresh same-key request 成为新 leader且总调用为2而非取消后额外 retry
  authoritative_sources:
  - title: ADR-017 Bounded Runtime Concurrency and Resilience
    reason: cancellation 后不得存在 orphan work 或无 ownership retry，metadata singleflight 不能改变 transport retry 边界
  - title: Python 3.11 asyncio tasks and cancellation
    url: https://docs.python.org/3.11/library/asyncio-task.html
    reason: shield 可隔离 waiter cancellation 与 inner task，因此调用方必须显式定义最后 waiter 离开后的 inner task ownership
  root_cause: AsyncSingleFlight 只保存每 key leader task，不记录 waiter 数；所有 waiter 都离开后仍永久 shield leader，adapter retry loop 无法感知请求已取消
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 按 key 计数 waiter；仍有 waiter 时保留 shared leader，最后 waiter 取消时在 lock 内 cancel leader并在返回前 await cleanup；clear 同样 cancel/await 全部 leader
  regression_tests:
  - backend/tests/unit/test_powerbi.py
  - backend/tests/unit/test_performance_runtime.py
  prohibited_patterns:
  - 最后一个 singleflight waiter 取消后让 leader/backoff/retry 继续后台运行
  - 为修最后 waiter 而让一个 waiter 取消传播给仍在等待的其他 caller
  prevention_rules:
  - shared task 必须同时定义 leader ownership 与 waiter ownership
  - cancellation regression 必须覆盖 sole waiter、surviving waiter 与 immediate fresh same-key request
  - lifecycle clear 必须 cancel 且 await application-owned task
  related_adr: ADR-017
  related_commits: []
  status: monitoring
  events:
