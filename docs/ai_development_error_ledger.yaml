  local_evidence: M2.6.3 Real grouped result 返回 qualified label；LocalMCPPowerBIAdapter normalization focused regression
  authoritative_sources:
  - title: PowerBIAgent QueryResult canonical field contract
    reason: Provider wire label 必须在 Adapter 边界标准化，业务层不得依赖传输展示格式
  root_cause: Adapter 原样暴露 Power BI wire column label，缺少 qualified base-column 到 canonical runtime column 的唯一化
  failed_attempts: []
