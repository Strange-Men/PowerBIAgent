- id: ERR-594-006
  title: 中英混合 entity-list 的 ASCII word boundary 丢失 shape
  category: ERR
  first_detected_version: M5.9.4
  symptom: 最小反例“请问list all 产品”无法命中 ENTITY_LIST，退化为 scalar
  local_evidence: pairwise object_surface × courtesy × entity_cue=english 固定复现；纯英文可通过而中文前缀版本失败
  authoritative_sources:
  - title: Python re word-boundary semantics
    url: https://docs.python.org/3.11/library/re.html
    reason: Unicode 模式的 word boundary 由相邻字符是否属于 \w 决定，CJK 与 ASCII 字母之间不保证产生 \b
  root_cause: entity-list 正则用 \blist 约束左边界；Unicode CJK 字符同属 \w，中文前缀紧邻 list 时边界不存在
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 将左边界收紧为仅排除 ASCII 字母、数字与下划线的 negative lookbehind，保持 list token 本身不被子串误命中
  regression_tests:
  - backend/tests/unit/test_business_language_stress.py
  prohibited_patterns:
  - 为具体中文礼貌词逐条增加 hardcode
  prevention_rules:
  - 中英混合 token 边界必须按目标 token 字符集定义并进入组合压力测试
  related_adr: ADR-018
  related_commits: []
  status: monitoring
  events:
  - date: '2026-09-10'
    action: discovered
    version: M5.9.4
  - date: '2026-09-10'
    action: mitigation
    version: M5.9.4
