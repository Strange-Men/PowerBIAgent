- id: ERR-594-004
  title: 相对年/月范围与无年份范围未形成完整时间 obligation
  category: ERR
  first_detected_version: M5.9.4
  symptom: “今年1月至6月”退化为普通 TREND 或全年范围；“1月到6月”可能被首月 parser 吞掉而非澄清年份
  local_evidence: current_year/yearless × 至/到/-/~ × word-order 矩阵确定复现；最小反例分别为“今年1月至6月销售额趋势”和“1月到6月销售额趋势”
  authoritative_sources:
  - title: ADR-018 Deterministic Semantic Expression Normalization
    reason: 显式月范围必须保留 start/end/month grain，无法唯一确定年份时必须 clarification
  - title: Python unicodedata.normalize
    url: https://docs.python.org/3.11/library/unicodedata.html
    reason: NFKC 可确定性统一全角数字和兼容字符而不引入业务事实
  root_cause: 公共月范围 parser 只接受显式四位开始年；Router、TimeGrounder 与 Coverage 因而不能区分相对年范围和不可解析的无年份范围义务
  failed_attempts: []
  repair_attempt_count: 1
  final_fix: 公共 parser 增加可注入 reference year 的今年/去年范围；独立 detector 保留无年份范围 obligation，Coverage 对后者给出 incomplete_time_range，阻止 DAX
  regression_tests:
