- id: ERR-542-001
  title: Explicit unresolved member 可能静默降级为无筛选查询
  category: ERR
  first_detected_version: M5.4.2
  symptom: 真实用户问题“火星区销售额”可能在 member 无匹配时移除筛选并返回全国销售额；明确但未解析的 semantic requirement 没有稳定保证 ZERO DAX
  local_evidence: M5.5 新线 failure reproducer 与生产入口回归证明“火星区销售额”返回 clarification，DAX/QueryResult/Memory commit 均为零；Real Rich PBIX、Sales/Education/Inventory、未知 opaque holdout 与 schema mutation gates 通过
  authoritative_sources:
  - title: ADR-008 Business Semantic Catalog and Grounding Authority
    reason: Filter member 必须由已 Ground field 上的 bounded runtime lookup 证明，UNRESOLVED 不得进入 Canonical QueryPlan
  - title: M5 Generalization and Acceptance Contract
    reason: explicit unresolved semantic requirement 必须 clarification/no-match 且 ZERO DAX
  root_cause: 旧实验范围同时改动语义、MCP 与展示，no-match 到执行边界缺少独立 failure reproducer、ZERO-DAX oracle 与跨域验收
  failed_attempts: []
  repair_attempt_count: 0
  final_fix: M5.5 将显式 member 与 object grounding 分离，所有 canonical member 必须经目标 runtime field 的 ColumnMembers exact validation；no-match/ambiguity 在 DAX、Power BI 与 Memory commit 前 fail closed，旧 Memory 不得覆盖当前 explicit failure
  regression_tests:
  - backend/tests/unit/test_semantic_grounding.py
  - backend/tests/api/test_chat.py
  prohibited_patterns:
  - member 无匹配时删除 filter 并执行更宽查询
  - 使用旧 committed member 覆盖当前 explicit unresolved member
  - 以 LLM 猜测或销售字段特判替代 runtime member authority
  prevention_rules:
  - explicit unresolved member/filter 只能 clarification 或 no-match
  - clarification/no-match 必须证明 DAX 和 Power BI 执行调用均为零
  - 成员别名必须绑定 model/schema/runtime member evidence
  related_adr: ADR-008
  related_commits: []
