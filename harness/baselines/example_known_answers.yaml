# Fictional values for offline Oracle verification only.
baselines:
  - oracle_key: total_sales
    mode: scalar
    expected_columns: ["[Total Sales]"]
    metric_columns: ["[Total Sales]"]
    expected_value: 1000.25

  - oracle_key: total_quantity
    mode: scalar
    expected_columns: ["[Total Quantity]"]
    metric_columns: ["[Total Quantity]"]
    expected_value: 42

  - oracle_key: electronics_sales
    mode: scalar
    expected_columns: ["[Total Sales]"]
    metric_columns: ["[Total Sales]"]
    expected_value: 410.10

  - oracle_key: sales_by_category
    mode: grouped
    expected_columns: [Category, "[Total Sales]"]
    key_columns: [Category]
    metric_columns: ["[Total Sales]"]
    expected_rows:
      - {Category: Electronics, "[Total Sales]": 410.10}
      - {Category: Furniture, "[Total Sales]": 330.05}
      - {Category: Office, "[Total Sales]": 260.10}

  - oracle_key: quantity_by_product
    mode: grouped
    expected_columns: [Product, "[Total Quantity]"]
    key_columns: [Product]
    metric_columns: ["[Total Quantity]"]
    expected_rows:
      - {Product: Alpha, "[Total Quantity]": 13}
      - {Product: Beta, "[Total Quantity]": 11}
      - {Product: Gamma, "[Total Quantity]": 9}

  - oracle_key: top3_products_sales
    mode: ordered
    expected_columns: [Product, "[Total Sales]"]
    key_columns: [Product]
    metric_columns: ["[Total Sales]"]
    sort: desc
    top_n: 3
    allow_top_n_ties: false
    expected_rows:
      - {Product: Alpha, "[Total Sales]": 300.00}
      - {Product: Beta, "[Total Sales]": 250.00}
      - {Product: Gamma, "[Total Sales]": 200.00}

  - oracle_key: top3_categories_quantity
    mode: ordered
    expected_columns: [Category, "[Total Quantity]"]
    key_columns: [Category]
    metric_columns: ["[Total Quantity]"]
    sort: desc
    top_n: 3
    allow_top_n_ties: false
    expected_rows:
      - {Category: Electronics, "[Total Quantity]": 18}
      - {Category: Furniture, "[Total Quantity]": 14}
      - {Category: Office, "[Total Quantity]": 10}

  - oracle_key: electronics_top3_products_quantity
    mode: ordered
    expected_columns: [Product, "[Total Quantity]"]
    key_columns: [Product]
    metric_columns: ["[Total Quantity]"]
    sort: desc
    top_n: 3
    allow_top_n_ties: false
    expected_rows:
      - {Product: Alpha, "[Total Quantity]": 8}
      - {Product: Beta, "[Total Quantity]": 6}
      - {Product: Gamma, "[Total Quantity]": 4}

  - oracle_key: electronics_sales_by_category
    mode: grouped
    expected_columns: [Category, "[Total Sales]"]
    key_columns: [Category]
    metric_columns: ["[Total Sales]"]
    expected_rows:
      - {Category: Electronics, "[Total Sales]": 410.10}

  - oracle_key: electronics_quantity_by_category
    mode: grouped
    expected_columns: [Category, "[Total Quantity]"]
    key_columns: [Category]
    metric_columns: ["[Total Quantity]"]
    expected_rows:
      - {Category: Electronics, "[Total Quantity]": 18}

  - oracle_key: sales_by_product
    mode: grouped
    expected_columns: [Product, "[Total Sales]"]
    key_columns: [Product]
    metric_columns: ["[Total Sales]"]
    expected_rows:
      - {Product: Alpha, "[Total Sales]": 300.00}
      - {Product: Beta, "[Total Sales]": 250.00}
      - {Product: Gamma, "[Total Sales]": 200.00}

  - oracle_key: furniture_sales
    mode: scalar
    expected_columns: ["[Total Sales]"]
    metric_columns: ["[Total Sales]"]
    expected_value: 330.05

  - oracle_key: top_product_sales
    mode: ordered
    expected_columns: [Product, "[Total Sales]"]
    key_columns: [Product]
    metric_columns: ["[Total Sales]"]
    sort: desc
    top_n: 1
    allow_top_n_ties: true
    expected_rows:
      - {Product: Alpha, "[Total Sales]": 300.00}
