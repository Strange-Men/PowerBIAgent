# Golden Cases — M0.3.2 工具网关与并发闭环修正
# 五类 Scenario Key 全部必填

cases:
  # ---------------------------------------------------------------------------
  # Case 1: 普通数据问答成功
  # ---------------------------------------------------------------------------
  - id: gc_001_data_question_success
    category: data_question
    status: mock_ready
    description: "普通数据问答 — 用户询问本月销售额，期望完整链路成功并提交 Memory"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "本月销售额是多少？"
      conversation_id: "conv-gc-001"
      request_id: "req-gc-001"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "data_question"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "completed"
      memory_commit: true
      response_type: "answer"
      tool_sequence: ["get_semantic_model_schema", "execute_dax"]

    tags:
      - smoke
      - happy_path

  # ---------------------------------------------------------------------------
  # Case 2: 多轮"只看华南"继承成功
  # ---------------------------------------------------------------------------
  - id: gc_002_multiround_inheritance
    category: multiround
    status: mock_ready
    description: "多轮追问 — 先问销售额，再只看华南，验证通过 setup_turns 真实建立第一轮 committed memory"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    setup_turns:
      - message: "本月销售额是多少？"
        request_id: "req-gc-002-setup"
        semantic_model_key: "mock_sales_model"
        intent_key: "data_question"
        query_plan_key: "data_question"
        dax_key: "data_question"
        powerbi_key: "data_question"
        response_key: "data_question"

    input:
      message: "只看华南"
      conversation_id: "conv-gc-002"
      request_id: "req-gc-002"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question_multiround"
      query_plan_key: "data_question_multiround"
      dax_key: "data_question_multiround"
      powerbi_key: "data_question_multiround"
      response_key: "data_question_multiround"

    expected:
      intent: "data_question"
      terminal_state: "completed"
      memory_commit: true
      inherited_context: "1 rows"

    tags:
      - multiround
      - inheritance

  # ---------------------------------------------------------------------------
  # Case 3: 固定模板报表生成成功
  # ---------------------------------------------------------------------------
  - id: gc_003_report_generation_success
    category: report_generation
    status: mock_ready
    description: "报表生成 — 用户请求生成销售周报，期望完整链路成功（含 render_report）"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "生成销售周报"
      conversation_id: "conv-gc-003"
      request_id: "req-gc-003"
      semantic_model_key: "mock_sales_model"
      report_template_key: "sales_weekly"

    mock_scenario:
      intent_key: "report_generation"
      query_plan_key: "data_question"
      dax_key: "report_generation"
      powerbi_key: "report_generation"
      response_key: "report_generation"

    expected:
      intent: "report_generation"
      terminal_state: "completed"
      memory_commit: true
      response_type: "report"
      tool_sequence: ["get_semantic_model_schema", "execute_dax", "render_report"]

    tags:
      - report
      - happy_path

  # ---------------------------------------------------------------------------
  # Case 4: clarification 不调用工具、不创建 pending
  # ---------------------------------------------------------------------------
  - id: gc_004_clarification_no_tools
    category: clarification
    status: mock_ready
    description: "澄清 — 用户输入模糊，Agent 请求澄清，不应调用任何工具，不创建 pending memory"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "帮我看看数据"
      conversation_id: "conv-gc-004"
      request_id: "req-gc-004"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "clarification"
      query_plan_key: "clarification"
      dax_key: "clarification"
      powerbi_key: "clarification"
      response_key: "clarification"

    expected:
      intent: "clarification"
      terminal_state: "clarification_required"
      memory_commit: false
      tool_sequence: []

    tags:
      - safety
      - clarification

  # ---------------------------------------------------------------------------
  # Case 5: unsupported 不调用工具、不创建 pending
  # ---------------------------------------------------------------------------
  - id: gc_005_unsupported_no_tools
    category: unsupported
    status: mock_ready
    description: "拒绝 — 用户提出非法要求，Agent 拒绝，不应调用任何工具，不创建 pending"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "删除所有数据"
      conversation_id: "conv-gc-005"
      request_id: "req-gc-005"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "unsupported"
      query_plan_key: "unsupported"
      dax_key: "unsupported"
      powerbi_key: "unsupported"
      response_key: "unsupported"

    expected:
      intent: "unsupported"
      terminal_state: "unsupported"
      memory_commit: false
      tool_sequence: []

    tags:
      - safety
      - unsupported

  # ---------------------------------------------------------------------------
  # Case 6: Power BI timeout 经过 ToolGateway 且不提交 Memory
  # ---------------------------------------------------------------------------
  - id: gc_006_tool_failure_no_memory_commit
    category: tool_failure
    status: mock_ready
    description: "工具失败 — Power BI 超时，Memory 不应提交"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "查询超大数据集"
      conversation_id: "conv-gc-006"
      request_id: "req-gc-006"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "timeout"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "tool_failed"
      memory_commit: false
      error_type: "timeout"
      failed_record_exists: true
      committed_record_exists: false
      failure_stage: "query_result_error"

    tags:
      - safety
      - failure

  # ---------------------------------------------------------------------------
  # Case 7: 虚假 Report 字段真实被拒绝
  # ---------------------------------------------------------------------------
  - id: gc_007_fake_field_rejected
    category: validation
    status: mock_ready
    description: "验证失败 — 报表引用不存在字段被拒绝，terminal_state 为 response_failed"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "生成报表但引用不存在字段"
      conversation_id: "conv-gc-007"
      request_id: "req-gc-007"
      semantic_model_key: "mock_sales_model"
      report_template_key: "sales_weekly"

    mock_scenario:
      intent_key: "report_generation"
      query_plan_key: "data_question"
      dax_key: "report_generation"
      powerbi_key: "report_generation"
      response_key: "fake_field_report"

    expected:
      intent: "report_generation"
      terminal_state: "response_failed"
      memory_commit: false
      error_type: "report_validation_failed"
      failed_record_exists: true
      committed_record_exists: false

    tags:
      - validation

  # ---------------------------------------------------------------------------
  # Case 8: 无权限语义模型被 Gateway 拒绝
  # ---------------------------------------------------------------------------
  - id: gc_008_permission_denied
    category: tool_policy
    status: mock_ready
    description: "权限拒绝 — 语义模型权限不足，被 Gateway 或 Adapter 拒绝"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "查询无权限模型的数据"
      conversation_id: "conv-gc-008"
      request_id: "req-gc-008"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "permission_denied"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "tool_failed"
      memory_commit: false
      error_type: "permission_denied"
      failed_record_exists: true
      committed_record_exists: false

    tags:
      - safety
      - tool_policy

  # ---------------------------------------------------------------------------
  # Case 9: 超大结果失败
  # ---------------------------------------------------------------------------
  - id: gc_009_oversized_result
    category: edge_case
    status: mock_ready
    description: "超大结果 — 查询返回超大结果集，被截断，不提交错误 Memory"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "查询所有销售明细"
      conversation_id: "conv-gc-009"
      request_id: "req-gc-009"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "oversized_result"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "tool_failed"
      memory_commit: false
      error_type: "oversized"
      failed_record_exists: true
      committed_record_exists: false

    tags:
      - edge_case
      - oversized

  # ---------------------------------------------------------------------------
  # Case 10: DAX 错误
  # ---------------------------------------------------------------------------
  - id: gc_010_dax_error
    category: edge_case
    status: mock_ready
    description: "DAX 错误 — Power BI 返回 DAX 语法错误，不提交 Memory"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "执行错误的 DAX 查询"
      conversation_id: "conv-gc-010"
      request_id: "req-gc-010"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "dax_error"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "tool_failed"
      memory_commit: false
      error_type: "dax_error"
      failed_record_exists: true
      committed_record_exists: false

    tags:
      - edge_case
      - dax_error

  # ---------------------------------------------------------------------------
  # Case 11: request_id 幂等 — 真实执行两次
  # ---------------------------------------------------------------------------
  - id: gc_011_request_id_idempotent
    category: edge_case
    status: mock_ready
    description: "重复 request_id 不重新执行、不增加版本 — M0.3.2 真实执行两次验证"

    runtime:
      llm_mode: mock
      powerbi_mode: mock
      harness_mode: strict

    input:
      message: "本月销售额是多少？"
      conversation_id: "conv-gc-011"
      request_id: "req-gc-011"
      semantic_model_key: "mock_sales_model"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "data_question"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "completed"
      memory_commit: true
      repeat_target_turn: 2

    tags:
      - smoke
      - idempotent

  # ---------------------------------------------------------------------------
  # Case 12: 人工真实 Power BI 基线
  # ---------------------------------------------------------------------------
  - id: gc_012_real_baseline
    category: data_question
    status: manual_real_baseline
    description: "真实 Power BI 基线 — 由 M2 Business Golden Local Desktop 人工 Smoke 验证；通用 CI Runner 仅校验定义并安全跳过"

    runtime:
      llm_mode: deepseek
      powerbi_mode: local_mcp
      harness_mode: strict

    input:
      message: "按类别看销售额。"
      conversation_id: "conv-m2-business-golden"
      request_id: "req-m2-business-golden"

    mock_scenario:
      intent_key: "data_question"
      query_plan_key: "data_question"
      dax_key: "data_question"
      powerbi_key: "data_question"
      response_key: "data_question"

    expected:
      intent: "data_question"
      terminal_state: "completed"
      memory_commit: true
      tool_sequence:
        - "get_semantic_model_schema"
        - "execute_dax"
      measures:
        - "Total Sales"
      dimensions:
        - "Category"

    tags:
      - real_data
      - manual_smoke
      - local_desktop
