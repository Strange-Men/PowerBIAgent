[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbiagent"
version = "0.1.0"
description = "Power BI 数据分析 Agent MVP — 自然语言驱动的 Power BI 数据问答与固定模板报表生成"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.12"
authors = [
    {name = "PowerBIAgent Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Internal",
    "Programming Language :: Python :: 3.11",
]

# ----------------------------------------------------------
# 核心依赖 — M0.4.1 已验证并锁定版本
# ----------------------------------------------------------
dependencies = [
    # Data Validation
    "pydantic==2.13.4",            # 数据校验

    # Config
    "pydantic-settings==2.14.2",   # Pydantic Settings（环境变量/配置管理）

    # Web Framework — M0.4 启用，M0.4.1 锁定版本
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",

    # M0.3 新增 — YAML Golden Cases
    "pyyaml==6.0.3",

    # M1.1: 网络调用（真实 LLM Provider 运行依赖）
    "httpx==0.28.1",

    # M2.1: Power BI Local MCP 正式 stdio Client
    "mcp==2.0.0",

    # M4.0: Persistence infrastructure
    "sqlalchemy==2.0.52",
    "aiosqlite==0.22.1",
    "alembic==1.19.1",

    # Utilities
    # "python-dotenv>=1.0.0",     # M1 启用
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
