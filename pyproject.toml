[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbiagent"
version = "0.1.0"
description = "Power BI 数据分析 Agent MVP — 自然语言驱动的 Power BI 数据问答与固定模板报表生成"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.12"
authors = [
    {name = "PowerBIAgent Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Internal",
    "Programming Language :: Python :: 3.11",
]

# ----------------------------------------------------------
# 核心依赖 — M0.2 已安装并验证
# ----------------------------------------------------------
dependencies = [
    # LLM / Agent Framework
    "pydantic-ai>=2.21.0",         # PydanticAI Agent 框架（ADR-001）
    "pydantic>=2.0.0",             # 数据校验

    # Data Validation
    # (pydantic 已覆盖)

    # Utilities
    # "python-dotenv>=1.0.0",     # M1 启用

    # Web Framework — M0.4 启用
    # "fastapi>=0.110.0",
    # "uvicorn[standard]>=0.27.0",

    # Power BI — M0.3 确定
    # Memory — M0.3/M1 启用
    # "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
