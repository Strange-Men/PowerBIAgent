<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>${title}</title>
<style>
  :root {
    --surface: #fcfcfb;
    --page-bg: #f2f1ee;
    --ink-primary: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #8a8985;
    --card-bg: #ffffff;
    --border: #e4e2dc;
    --track: #ecebe7;
    --seq-700: #0d366b;
    --seq-550: #1c5cab;
    --seq-400: #3987e5;
    --seq-100: #cde2fb;
    --categorical-1: #2a78d6;
    --categorical-2: #eb6834;
    --categorical-3: #1baf7a;
    --categorical-4: #eda100;
    --categorical-5: #e87ba4;
    --categorical-6: #008300;
    --categorical-7: #4a3aa7;
    --categorical-8: #e34948;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
    --radius: 10px;
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink-primary);
    font-family: var(--font);
    line-height: 1.5;
  }
  .report {
    width: min(100%, 1600px);
    margin: 0 auto;
    padding: clamp(18px, 2.2vw, 32px) clamp(14px, 2.5vw, 32px) 40px;
  }
  .report-header { margin-bottom: 20px; }
  .report-header h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .report-subtitle {
    margin: 0;
    color: var(--ink-secondary);
    font-size: 13px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--gap);
    margin-bottom: var(--gap);
  }
  .kpi-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .kpi-label {
    color: var(--ink-secondary);
    font-size: 13px;
  }
  .kpi-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--seq-700);
  }
  .section-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: var(--gap);
  }
  .section-card.half { margin-bottom: 0; }
  .section-title {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-primary);
  }
  .pair {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--gap);
    margin-bottom: var(--gap);
  }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-line { width: 100%; overflow: hidden; }
  .chart-line svg { height: clamp(190px, 20vw, 250px); }
  .chart-axis-label {
    font-family: var(--font);
    font-size: 11px;
    fill: var(--ink-muted);
  }
  .chart-direct-label {
    font-family: var(--font);
    font-size: 11px;
    fill: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }
  /* horizontal bars */
  .bar-row {
    display: grid;
    grid-template-columns: minmax(110px, 34%) 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }
  .bar-label {
    font-size: 13px;
    color: var(--ink-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-label .result-position {
    display: block;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .bar-name { font-weight: 500; }
  .bar-track {
    height: 10px;
    border-radius: 5px;
    background: var(--track);
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    border-radius: 5px;
    background: var(--seq-400);
  }
  .bar-row.negative .bar-fill { background: var(--categorical-8); }
  .bar-row.zero .bar-fill { background: var(--ink-muted); }
  .bar-value {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-secondary);
    text-align: right;
    white-space: nowrap;
  }
  /* columns */
  .chart-column {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    min-height: 180px;
    padding-top: 18px;
  }
  .column-item {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .column-value {
    font-size: 11px;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .column-track {
    width: 100%;
    height: 120px;
    display: flex;
    align-items: flex-end;
    background: var(--track);
    border-radius: 6px 6px 0 0;
    overflow: hidden;
  }
  .column-fill {
    display: block;
    width: 100%;
    border-radius: 6px 6px 0 0;
    background: var(--seq-400);
  }
  .column-item.negative .column-fill { background: var(--categorical-8); }
  .column-item.zero .column-fill { background: var(--ink-muted); }
  .column-label {
    font-size: 12px;
    color: var(--ink-primary);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* donut */
  .chart-donut {
    display: grid;
    grid-template-columns: minmax(160px, 220px) minmax(220px, 1fr);
    align-items: center;
    gap: clamp(14px, 2vw, 28px);
    max-width: 760px;
    margin: 0 auto;
  }
  .donut-svg { display: grid; place-items: center; }
  .donut-svg svg { width: min(100%, 210px); }
  .donut-legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .donut-legend-item {
    display: grid;
    grid-template-columns: 10px 1fr auto auto;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    align-self: center;
  }
  .legend-label { color: var(--ink-primary); }
  .legend-value {
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }
  .legend-percent { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .report-footer {
    margin-top: 4px;
    color: var(--ink-muted);
    font-size: 11px;
    line-height: 1.7;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
    overflow-wrap: anywhere;
  }
  .report-footer span:not(:last-child)::after { content: " ·"; }
  @media (min-width: 1440px) {
    .section-card { padding: 20px 24px; }
    .pair { gap: 20px; }
  }
  @media (max-width: 760px) {
    .pair { grid-template-columns: 1fr; }
    .section-card.half { margin-bottom: var(--gap); }
    .chart-donut { grid-template-columns: 1fr; }
    .donut-legend { width: min(100%, 520px); margin: 0 auto; }
    .chart-line svg { height: 210px; }
  }
  @media (max-width: 430px) {
    .report { padding: 16px 12px 28px; }
    .report-header h1 { font-size: 20px; }
    .kpi-grid { grid-template-columns: minmax(0, 1fr); }
    .kpi-value { font-size: 22px; }
    .section-card { padding-inline: 12px; overflow: hidden; }
    .chart-axis-label { font-size: 15px; }
    .chart-direct-label { font-size: 15px; }
    .bar-row { grid-template-columns: minmax(0, 1fr) auto; gap: 5px 8px; }
    .bar-label { grid-column: 1 / -1; }
    .bar-track { grid-column: 1; }
    .bar-value { grid-column: 2; }
    .chart-column { gap: 6px; }
    .column-value { font-size: 10px; }
    .donut-legend-item {
      grid-template-columns: 10px minmax(0, 1fr) auto auto;
      gap: 5px;
    }
    .legend-label { min-width: 0; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<main class="report">
  <header class="report-header">
    <h1>${title}</h1>
    <p class="report-subtitle">销售分析报表 · 自适应能力驱动布局</p>
  </header>
  ${kpi_block}
  ${trend_block}
  ${pair_one_block}
  ${pair_two_block}
  <footer class="report-footer">${footer}</footer>
</main>
</body>
</html>
