<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #172033; background: #f4f6f9; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #f4f6f9; }
    main { max-width: 1040px; margin: 0 auto; background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 32px; box-shadow: 0 8px 28px rgba(23, 32, 51, 0.07); }
    h1 { margin: 0 0 24px; font-size: 30px; letter-spacing: 0.02em; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 30px; }
    .kpi { border: 1px solid #dce3ed; border-radius: 10px; padding: 20px; background: #f9fbfd; }
    .kpi-label { display: block; color: #627087; font-size: 14px; margin-bottom: 8px; }
    .kpi-value { display: block; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    section { margin-top: 28px; }
    .table-wrap { overflow-x: auto; border: 1px solid #e0e5ec; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; border-bottom: 1px solid #e8ecf1; text-align: left; }
    th { background: #f3f6fa; color: #48566d; font-size: 13px; font-weight: 600; }
    tbody tr:last-child td { border-bottom: 0; }
    .number { text-align: right; font-variant-numeric: tabular-nums; }
    footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid #e5e9ef; color: #68758a; font-size: 12px; line-height: 1.8; }
    footer span { display: inline-block; margin-right: 20px; }
    @media (max-width: 640px) { body { padding: 12px; } main { padding: 20px; } .kpis { grid-template-columns: 1fr; } }
    @media print { body { padding: 0; background: #fff; } main { max-width: none; border: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <main>
    <h1>$title</h1>
    <div class="kpis" aria-label="关键指标">
      <div class="kpi"><span class="kpi-label">总销售额</span><span class="kpi-value">$total_sales</span></div>
      <div class="kpi"><span class="kpi-label">总销量</span><span class="kpi-value">$total_quantity</span></div>
    </div>

    <section>
      <h2>按类别销售额</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Category</th><th class="number">Total Sales</th></tr></thead>
          <tbody>$category_rows</tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Top 5 产品销售额</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="number">序号</th><th>Product</th><th class="number">Total Sales</th></tr></thead>
          <tbody>$product_rows</tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>数据来源：$data_source</span>
      <span>source_mode：$source_mode</span>
      <span>模板版本：$contract_version</span>
      <span>生成时间：$generated_at</span>
    </footer>
  </main>
</body>
</html>
