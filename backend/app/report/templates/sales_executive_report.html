<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>${title}</title>
<style>
  :root {
    --navy-950: #071b35;
    --navy-900: #0b274c;
    --navy-800: #123d70;
    --blue-650: #1466d9;
    --blue-500: #2f83ed;
    --blue-300: #83b9f6;
    --blue-100: #eaf3ff;
    --ink: #102744;
    --ink-soft: #49627f;
    --ink-muted: #71859d;
    --surface: #ffffff;
    --canvas: #edf3f9;
    --line: #d8e3ef;
    --good: #108a5b;
    --warning: #b97300;
    --radius: 13px;
    --shadow: 0 8px 26px rgba(9, 43, 82, 0.08);
    --font: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { min-width: 0; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-width: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.5;
    overflow-x: hidden;
  }
  .executive-report {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 clamp(10px, 1.6vw, 24px) 24px;
    min-width: 0;
  }
  .executive-header {
    margin: 0 calc(clamp(10px, 1.6vw, 24px) * -1) 12px;
    padding: 18px clamp(16px, 3vw, 42px);
    background: linear-gradient(112deg, var(--navy-950), var(--navy-800));
    color: #fff;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(520px, auto);
    gap: 24px;
    align-items: center;
    overflow: hidden;
  }
  .brand-lockup { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .brand-mark {
    width: 46px; height: 46px; flex: 0 0 46px;
    display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 4px;
  }
  .brand-mark span { display: block; background: var(--blue-500); border-radius: 3px 3px 0 0; }
  .brand-mark span:nth-child(1) { height: 38%; }
  .brand-mark span:nth-child(2) { height: 66%; }
  .brand-mark span:nth-child(3) { height: 100%; }
  .executive-header h1 { margin: 0; font-size: clamp(25px, 3vw, 38px); line-height: 1.16; overflow-wrap: anywhere; }
  .executive-eyebrow { margin: 4px 0 0; font-size: 13px; letter-spacing: 0.13em; color: #cce1fb; }
  .header-meta {
    display: grid; grid-template-columns: repeat(4, minmax(112px, 1fr)); gap: 8px 14px;
    min-width: 0; font-size: 12px;
  }
  .header-meta div { min-width: 0; border-left: 1px solid rgba(255,255,255,.28); padding-left: 12px; }
  .header-meta span { display: block; color: #abc7e8; }
  .header-meta strong { display: block; margin-top: 2px; font-weight: 600; overflow-wrap: anywhere; }
  .report-panel {
    min-width: 0;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-heading {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 15px;
    background: linear-gradient(90deg, #edf5ff, #f8fbff);
    border-bottom: 1px solid var(--line);
  }
  .section-number {
    flex: 0 0 auto;
    min-width: 36px;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--navy-800);
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .panel-heading > div { min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 14px; }
  .panel-heading h2 { margin: 0; font-size: 16px; line-height: 1.35; }
  .panel-heading p { margin: 0; color: var(--ink-soft); font-size: 11px; letter-spacing: .06em; }
  .context-strip {
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .context-grid {
    padding: 10px 12px 8px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .context-card {
    min-width: 0;
    padding: 8px 10px;
    border-left: 3px solid var(--blue-300);
    border-radius: 7px;
    background: #f6f9fd;
    overflow-wrap: anywhere;
  }
  .context-card span, .context-card strong { display: block; }
  .context-card span { color: var(--ink-muted); font-size: 9px; letter-spacing: .04em; }
  .context-card strong { margin-top: 2px; font-size: 11px; line-height: 1.35; }
  .context-definition-summary {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    padding: 7px 12px 9px; border-top: 1px solid #e9f0f7;
  }
  .context-definition-summary span { flex: 0 0 auto; color: var(--blue-650); font-size: 10px; font-weight: 800; }
  .context-definition-summary strong { min-width: 0; color: var(--ink-soft); font-size: 10px; font-weight: 500; overflow-wrap: anywhere; }
  .metric-definition-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .metric-definition { min-width: 0; padding: 8px; border-radius: 8px; background: #f1f6fc; }
  .metric-definition strong, .metric-definition span, .metric-definition small { display: block; overflow-wrap: anywhere; }
  .metric-definition strong { font-size: 12px; }
  .metric-definition span { color: var(--ink-soft); font-size: 10px; }
  .metric-definition small { color: var(--ink-muted); font-size: 9px; }
  .kpi-grid { padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .executive-kpi {
    position: relative; min-width: 0; padding: 16px 15px 15px 20px;
    border: 1px solid var(--line); border-radius: 11px; background: #fff; overflow: hidden;
  }
  .kpi-accent { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--blue-500); }
  .kpi-label { display: block; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .kpi-value { display: block; margin-top: 5px; color: var(--navy-900); font-size: clamp(24px, 2.3vw, 34px); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .executive-kpi small { display: block; margin-top: 4px; color: var(--ink-muted); font-size: 10px; overflow-wrap: anywhere; }
  .executive-grid { padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .structure-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ranking-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .visual-card { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .visual-card-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
  .visual-card-heading h3 { min-width: 0; margin: 0; font-size: 13px; overflow-wrap: anywhere; }
  .visual-card-heading span { flex: 0 0 auto; color: var(--ink-muted); font-size: 9px; }
  .chart-frame { min-width: 0; width: 100%; margin-top: 8px; }
  .executive-line-chart { padding: 6px 14px 10px; overflow: hidden; }
  .executive-line-chart svg { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 420; overflow: hidden; }
  .trend-grid line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .trend-grid text, .trend-ticks text { font: 12px var(--font); fill: var(--ink-muted); }
  .trend-line { fill: none; stroke: var(--blue-650); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .trend-area { fill: #dcecff; opacity: .75; }
  .trend-point { fill: var(--blue-650); stroke: white; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .chart-legend { display: flex; align-items: center; justify-content: flex-end; gap: 7px; color: var(--ink-soft); font-size: 10px; }
  .legend-line { width: 22px; height: 3px; border-radius: 2px; background: var(--blue-650); }
  .trend-ticks--tablet, .trend-ticks--mobile { display: none; }
  .executive-columns { min-height: 210px; display: grid; grid-template-columns: repeat(var(--count, 1), minmax(0, 1fr)); grid-auto-flow: column; align-items: end; gap: 8px; }
  .executive-column { min-width: 0; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
  .column-value { color: var(--ink-soft); font-size: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .column-track { width: min(44px, 82%); height: 135px; display: flex; align-items: end; border-radius: 6px 6px 0 0; background: #e8eff7; overflow: hidden; }
  .column-track > span { width: 100%; min-height: 2px; background: linear-gradient(180deg, var(--blue-500), var(--blue-650)); }
  .column-label { max-width: 100%; min-height: 32px; color: var(--ink-soft); font-size: 10px; text-align: center; overflow-wrap: anywhere; }
  .executive-donut { display: grid; grid-template-columns: minmax(145px, .8fr) minmax(0, 1.2fr); align-items: center; gap: 10px; }
  .executive-donut svg { width: 100%; max-height: 210px; }
  .donut-track, .donut-segment { fill: none; stroke-width: 28; }
  .donut-track { stroke: #e6edf5; }
  .donut-segment { transform: rotate(-90deg); transform-origin: 100px 100px; }
  .donut-segment-1 { stroke: #1d70e7; } .donut-segment-2 { stroke: #4ea5ef; }
  .donut-segment-3 { stroke: #22a881; } .donut-segment-4 { stroke: #e2a43a; }
  .donut-segment-5 { stroke: #7a6fd0; } .donut-segment-6 { stroke: #eb7a45; }
  .donut-segment-7 { stroke: #3e8fba; } .donut-segment-8 { stroke: #a76fae; }
  .executive-donut svg text { font: 700 15px var(--font); fill: var(--ink); }
  .executive-donut svg .donut-caption { font-size: 10px; fill: var(--ink-muted); font-weight: 400; }
  .executive-legend { list-style: none; margin: 0; padding: 0; min-width: 0; display: grid; gap: 5px; }
  .executive-legend li { min-width: 0; display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 6px; font-size: 10px; }
  .executive-legend li span:nth-child(2) { overflow-wrap: anywhere; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-650); }
  .legend-dot[data-color-index="2"] { background: #4ea5ef; } .legend-dot[data-color-index="3"] { background: #22a881; }
  .legend-dot[data-color-index="4"] { background: #e2a43a; } .legend-dot[data-color-index="5"] { background: #7a6fd0; }
  .legend-dot[data-color-index="6"] { background: #eb7a45; } .legend-dot[data-color-index="7"] { background: #3e8fba; }
  .legend-dot[data-color-index="8"] { background: #a76fae; }
  .executive-hbars { display: grid; gap: 7px; }
  .executive-bar-row { min-width: 0; display: grid; grid-template-columns: minmax(120px, 38%) minmax(60px, 1fr) auto; align-items: center; gap: 8px; }
  .executive-bar-label { min-width: 0; display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 7px; font-size: 10px; }
  .executive-bar-label > span:last-child { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .rank-badge { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--blue-650); color: white; font-size: 9px; font-weight: 800; }
  .rank-badge.muted { background: #90a6bd; }
  .executive-bar-track { height: 8px; border-radius: 6px; background: #e7eef6; overflow: hidden; }
  .executive-bar-track > span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--blue-300), var(--blue-500)); }
  .executive-bar-row > strong { font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-wrap { margin-top: 8px; width: 100%; min-width: 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 10px; }
  th, td { min-width: 0; padding: 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th { background: #eff5fb; color: var(--navy-800); text-align: left; }
  th:first-child, td:first-child { width: 58px; text-align: center; }
  th:last-child, td:last-child { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .audit-footer {
    min-width: 0; padding: 12px 16px; border-radius: var(--radius); background: #e7eef6; color: var(--ink-soft);
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;
  }
  .audit-footer div { min-width: 0; }
  .audit-footer span, .audit-footer strong { display: block; overflow-wrap: anywhere; }
  .audit-footer span { color: var(--ink-muted); font-size: 9px; }
  .audit-footer strong { margin-top: 2px; font-size: 10px; font-weight: 600; }
  .audit-definitions { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid #cad7e5; }
  .audit-definitions .metric-definition-list { margin-top: 6px; }
  .audit-definitions .metric-definition { background: rgba(255,255,255,.52); }
  [tabindex="0"]:focus-visible { outline: 3px solid var(--blue-500); outline-offset: 2px; }
  @media (max-width: 1100px) {
    .executive-header { grid-template-columns: 1fr; }
    .header-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .context-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .audit-footer { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .trend-ticks--desktop { display: none; } .trend-ticks--tablet { display: inline; }
  }
  @media (max-width: 760px) {
    .executive-report { padding-left: 10px; padding-right: 10px; }
    .executive-header { margin-left: -10px; margin-right: -10px; padding: 18px 15px; }
    .brand-mark { width: 38px; height: 38px; flex-basis: 38px; }
    .header-meta { grid-template-columns: 1fr 1fr; }
    .context-grid, .structure-grid, .ranking-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric-definition-list { grid-template-columns: 1fr; }
    .context-definition-summary { align-items: flex-start; flex-direction: column; gap: 2px; }
    .executive-line-chart { padding-left: 4px; padding-right: 4px; }
    .trend-ticks--tablet { display: none; } .trend-ticks--mobile { display: inline; }
    .audit-footer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 430px) {
    .brand-lockup { gap: 11px; }
    .executive-header h1 { font-size: 23px; }
    .header-meta { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: 1fr; }
    .executive-donut { grid-template-columns: 1fr; }
    .executive-bar-row { grid-template-columns: minmax(0, 1fr) auto; }
    .executive-bar-label { grid-column: 1 / -1; }
    .executive-bar-track { min-width: 0; }
    .audit-footer { grid-template-columns: 1fr; }
    .panel-heading { align-items: flex-start; }
    .panel-heading > div { display: block; }
    .panel-heading p { margin-top: 2px; }
  }
</style>
</head>
<body>
<main class="executive-report" data-template-key="sales_executive_report" data-template-tier="complex">
  <header class="executive-header" data-section="executive_header">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <div><h1>${title}</h1><p class="executive-eyebrow">SALES EXECUTIVE REPORT</p></div>
    </div>
    <div class="header-meta">
      <div><span>分析期间</span><strong>${analysis_period}</strong></div>
      <div><span>语义模型 / 来源</span><strong>${semantic_model}<br/>${source_display}</strong></div>
      <div><span>数据更新时间</span><strong>${freshness}</strong></div>
      <div><span>生成时间</span><strong>${generated_at}</strong></div>
    </div>
  </header>
  ${reading_context}
  ${kpi_block}
  ${trend_block}
  ${structure_block}
  ${ranking_block}
  ${audit_footer}
</main>
</body>
</html>
