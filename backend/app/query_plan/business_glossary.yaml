# Optional business-language supplements migrated from the former Desktop glossary.
# Profiles are inert: no model inherits them by name, schema shape or domain.
# Activation requires a separately approved exact model identity + fingerprint.
# Object IDs reference runtime objects; no table/type/schema declarations here.
version: 2
profiles:
  desktop_calendar_roles:
    field:Date:Date:
      temporal_role: default
    field:Date:YearMonth:
      aliases: [月份, 月度]
      temporal_grouping:
        grain: month
        date_field: Date
        date_table_name: Date
overrides: []
