# PowerBIAgent Validation — 版本无关通用 CI
# 触发: push main/m5/rebuild, PR 指向 main/m5/rebuild, workflow_dispatch
# 环境: windows-latest, Python 3.11, Node.js 24 LTS, LLM_MODE=mock, POWERBI_MODE=mock
# 禁止: 真实 API Key, api.deepseek.com, continue-on-error, 无限重试

name: PowerBIAgent Validation

on:
  push:
    branches: [main, m5/rebuild]
  pull_request:
    branches: [main, m5/rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full Validation (Windows)
    runs-on: windows-latest

    env:
      LLM_MODE: mock
      POWERBI_MODE: mock
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify install
        run: |
          python -c "import fastapi; import uvicorn; import pydantic; import pydantic_settings; import httpx; import yaml; print('All imports OK')"

      # ── Security ─────────────────────────────────────────────────
      - name: 1. Repository security scan
        run: python scripts/check_repository_safety.py

      - name: 2. AI error ledger validator
        run: python scripts/check_ai_error_ledger.py

      # ── Architecture gate (AST-based) ────────────────────────────
      - name: 3. Architecture gate
        run: python scripts/check_architecture_gate.py

      - name: 4. Documentation governance
        run: python scripts/check_documentation_governance.py

      - name: Artifact Governance Gate
        run: python scripts/check_artifact_governance.py

      # ── Tests ────────────────────────────────────────────────────
      - name: 5. Semantic Compatibility Gate
        run: python scripts/check_semantic_compatibility.py

      - name: 6. Full pytest (includes dynamic version consistency)
        run: python scripts/run_pytest_ci.py backend/tests -q

      - name: 7. Golden Cases
        run: python -m backend.app.harness.cases

      - name: Auth Productization Gate
        run: python -m pytest backend/tests/api/test_m6_5_2_auth_productization.py backend/tests/api/test_auth_security.py backend/tests/unit/test_msal_identity.py -q

      - name: Catalog Scalability Gate
        run: python -m pytest backend/tests/unit/test_m6_5_2_catalog_scalability.py backend/tests/unit/test_m6_5_2_catalog_transport.py backend/tests/api/test_m6_5_2_catalog_boundary.py -q

      - name: Product Authorization Gate
        run: python -m pytest backend/tests/unit/test_m6_5_2_product_authorization.py backend/tests/unit/test_m6_5_2_product_selection.py backend/tests/unit/test_m6_5_2_report_mapping.py -q

      - name: Cloud Runtime Stability Gate
        run: python -m pytest backend/tests/unit/test_m6_5_2_product_selection.py backend/tests/unit/test_m6_5_2_fix_resource_link.py backend/tests/api/test_cloud_product_api.py -q

      - name: Failure Classification Gate
        run: python -m pytest backend/tests/api/test_m6_5_2_fix_failure_trace.py -q

      - name: Metadata Amplification Gate
        run: python -m pytest backend/tests/unit/test_m6_5_2_product_selection.py backend/tests/unit/test_m6_5_2_report_mapping.py -q

      - name: English Natural Query Gate
        run: python -m pytest backend/tests/unit/test_m6_5_2_fix_english.py backend/tests/unit/test_cross_language_grounding.py -q

      # ── Frontend validation ──────────────────────────────────────
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Localization Completeness Gate
        run: python scripts/check_localization_completeness.py

      - name: UI Localization Gate
        working-directory: frontend
        run: npx vitest run src/components/CloudCatalogPicker.test.tsx src/components/CloudWorkspace.test.tsx src/components/CloudAccountSettings.test.tsx src/components/Sidebar.test.tsx src/authProxy.test.ts

      - name: 8. Frontend tests
        working-directory: frontend
        run: npm test

      - name: 9. Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: 10. Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: 11. Frontend production build
        working-directory: frontend
        run: npm run build

      # ── Final checks ─────────────────────────────────────────────
      - name: 12. Git diff check (strict)
        run: |
          python -c "
          import subprocess, sys
          failed = False
          def run(cmd):
              return subprocess.run(cmd, capture_output=True, text=True, encoding='utf-8', errors='replace')
          r = run(['git', 'diff', '--check'])
          if r.returncode != 0:
              print('FAIL: git diff --check')
              print((r.stdout or '') + (r.stderr or ''))
              failed = True
          r = run(['git', 'diff', '--exit-code'])
          if r.returncode != 0:
              print('FAIL: git diff --exit-code (staged or unstaged changes)')
              print((r.stdout or '') + (r.stderr or ''))
              failed = True
          r = run(['git', 'status', '--porcelain'])
          if (r.stdout or '').strip():
              print('FAIL: git status --porcelain (untracked or modified files):')
              print(r.stdout)
              failed = True
          if failed:
              sys.exit(1)
          print('Git state: OK - working tree clean')
          "
