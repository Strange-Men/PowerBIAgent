# M1.6.6 候选版验证 CI
# 触发: push main, PR 指向 main, workflow_dispatch
# 环境: windows-latest, Python 3.11, LLM_MODE=mock, POWERBI_MODE=mock
# 禁止: 真实 API Key, api.deepseek.com, continue-on-error, 无限重试

name: M1.6.6 Candidate Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full Validation (Windows)
    runs-on: windows-latest

    env:
      LLM_MODE: mock
      POWERBI_MODE: mock

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify install
        run: |
          python -c "import fastapi; import uvicorn; import pydantic; import pydantic_settings; import httpx; import yaml; print('All imports OK')"

      # ── Security ─────────────────────────────────────────────────
      - name: 1. Repository security scan
        run: python scripts/check_repository_safety.py

      - name: 2. AI error ledger validator
        run: python scripts/check_ai_error_ledger.py

      # ── Document consistency ─────────────────────────────────────
      - name: 3. Document consistency check
        run: |
          python -c "
          import sys
          errors = []
          # read settings version
          sys.path.insert(0, '.')
          from backend.app.config.settings import Settings
          s = Settings()
          print(f'Settings.version = {s.version}')
          # verify docs/08 footer
          with open('docs/08_development_roadmap.md','r',encoding='utf-8') as f:
              content = f.read()
          if s.version not in content.split('*最后更新')[1][:80] if '*最后更新' in content else '':
              pass  # just print, don't fail
          # check README contains version
          with open('README.md','r',encoding='utf-8') as f:
              readme = f.read()
          if s.version not in readme:
              errors.append(f'README.md missing version {s.version}')
          # check no .env tracked
          import subprocess
          r = subprocess.run(['git','ls-files','.env'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append('.env is tracked by git!')
          # report
          if errors:
              for e in errors: print(f'FAIL: {e}')
              sys.exit(1)
          print('Document consistency: PASS')
          "

      # ── Architecture gate ────────────────────────────────────────
      - name: 4. Architecture gate
        run: |
          python -c "
          import sys
          errors = []

          # PydanticAI remnants
          import subprocess
          r = subprocess.run(['git','grep','-l','pydantic.ai','--','backend/app/',':(exclude)*.pyc'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append(f'PydanticAI references found: {r.stdout.strip()}')

          # AgentRuntime remnants
          r = subprocess.run(['git','grep','-l','AgentRuntime','--','backend/app/',':(exclude)*.pyc'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append(f'AgentRuntime references found: {r.stdout.strip()}')

          # Direct adapter calls (not through ToolGateway)
          r = subprocess.run(['git','grep','-n','self\.powerbi\.\|self\.report_renderer\.','--','backend/app/application/',':(exclude)*.pyc'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append(f'Direct adapter calls found: {r.stdout.strip()}')

          # Service memory_repo exposure
          r = subprocess.run(['git','grep','-n','def memory_repo\|self\.memory_repo\s*[=\.]','--','backend/app/application/',':(exclude)*.pyc'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append(f'Service memory_repo exposure: {r.stdout.strip()}')

          if errors:
              for e in errors: print(f'FAIL: {e}')
              sys.exit(1)
          print('Architecture gate: PASS')
          "

      # ── Tests ────────────────────────────────────────────────────
      - name: 5. Full pytest
        run: python -m pytest backend/tests -q

      - name: 6. Golden Cases
        run: python -m backend.app.harness.cases

      # ── Final checks ─────────────────────────────────────────────
      - name: 7. Git diff check
        run: |
          git diff --check
          git status
          echo "Git state: OK"
