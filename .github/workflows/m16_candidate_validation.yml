# M1.6.6 候选版验证 CI
# 触发: push main, PR 指向 main, workflow_dispatch
# 环境: windows-latest, Python 3.11, LLM_MODE=mock, POWERBI_MODE=mock
# 禁止: 真实 API Key, api.deepseek.com, continue-on-error, 无限重试

name: M1.6.6 Candidate Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full Validation (Windows)
    runs-on: windows-latest

    env:
      LLM_MODE: mock
      POWERBI_MODE: mock
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify install
        run: |
          python -c "import fastapi; import uvicorn; import pydantic; import pydantic_settings; import httpx; import yaml; print('All imports OK')"

      # ── Security ─────────────────────────────────────────────────
      - name: 1. Repository security scan
        shell: bash
        run: |
          set -e
          python scripts/check_repository_safety.py 2>&1 || {
            echo "::warning::Security scan found issues or encountered an error."
            echo "::group::Debug: git tracked files"
            git ls-files --cached | head -50
            echo "::endgroup::"
            echo "::group::Debug: untracked non-ignored files"
            git ls-files --others --exclude-standard | head -20
            echo "::endgroup::"
            exit 1
          }

      - name: 2. AI error ledger validator
        run: python scripts/check_ai_error_ledger.py

      # ── Document consistency ─────────────────────────────────────
      - name: 3. Document consistency check
        run: |
          python -c "
          import sys, re, subprocess
          errors = []
          sys.path.insert(0, '.')
          from backend.app.config.settings import Settings
          s = Settings()
          print(f'Settings.version = {s.version}')

          # 1. Settings.version must be M1.6.6
          if s.version != 'M1.6.6':
              errors.append(f'Settings.version={s.version}, expected M1.6.6')

          # 2. README must contain M1.6.6
          with open('README.md','r',encoding='utf-8') as f:
              readme = f.read()
          if 'M1.6.6' not in readme:
              errors.append('README.md missing M1.6.6')
          if '二审候选' not in readme:
              errors.append('README.md missing 二审候选')

          # 3. docs/08 header must show M1.6.6 as current
          with open('docs/08_development_roadmap.md','r',encoding='utf-8') as f:
              roadmap = f.read()
          if 'M1.6.6' not in roadmap.split('状态：')[1][:30] if '状态：' in roadmap else '':
              errors.append('docs/08 header not showing M1.6.6 as current')

          # 4. docs/08 M1.6.5 must be marked completed
          if 'M1.6.5' in roadmap:
              m165_section = roadmap.split('M1.6.5')[1][:50] if 'M1.6.5' in roadmap else ''
              if '✅ 已完成' not in m165_section:
                  errors.append('docs/08 M1.6.5 not marked completed in overview')

          # 5. docs/08 M1.6.5 detail section must be completed
          if '### M1.6.5' in roadmap:
              m165_detail = roadmap.split('### M1.6.5')[1].split('###')[0]
              if '✅ 已完成' not in m165_detail[:100]:
                  errors.append('docs/08 M1.6.5 detail section not completed')

          # 6. docs/09 current phase must be M1.6.6
          with open('docs/09_context_handoff.md','r',encoding='utf-8') as f:
              handoff = f.read()
          if 'M1.6.6' not in handoff.split('当前阶段')[1][:80] if '当前阶段' in handoff else '':
              errors.append('docs/09 current phase not M1.6.6')

          # 7. docs/09 previous round must be M1.6.5
          if '上一轮' in handoff:
              prev_section = handoff.split('上一轮')[1][:100]
              if 'M1.6.5' not in prev_section:
                  errors.append('docs/09 previous round not M1.6.5')

          # 8. docs/09 next action must mention 二审
          if '下一动作' in handoff:
              next_section = handoff.split('下一动作')[1][:100]
              if '二审' not in next_section:
                  errors.append('docs/09 next action missing 二审')

          # 9. No two M1.6.x versions both marked '进行中'
          in_progress = [m.group(0) for m in re.finditer(r'M1\.6\.\d.*进行中', roadmap)]
          if len(in_progress) > 1:
              errors.append(f'Multiple M1.6.x versions in progress: {in_progress}')

          # 10. .env must not be tracked
          r = subprocess.run(['git','ls-files','.env'], capture_output=True, text=True)
          if r.stdout.strip():
              errors.append('.env is tracked by git!')

          if errors:
              for e in errors:
                  print(f'FAIL: {e}')
              sys.exit(1)
          print('Document consistency: PASS')
          "

      # ── Architecture gate (AST-based, CI-166-002) ─────────────────
      - name: 4. Architecture gate
        run: python scripts/check_architecture_gate.py

      # ── Tests ────────────────────────────────────────────────────
      - name: 5. Full pytest
        run: python -m pytest backend/tests -q

      - name: 6. Golden Cases
        run: python -m backend.app.harness.cases

      # ── Final checks ─────────────────────────────────────────────
      - name: 7. Git diff check
        run: |
          git diff --check
          git status
          echo "Git state: OK"
